<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualiser — James Norman</title>
<meta name="description" content="A ridge-line music visualiser by James Norman.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#000;
    --ink:#fff;
    --dim:#3a3530;
    --mid:#6a6050;
    --hi:#b8a888;
  }
  html,body{height:100%}
  body{background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;
    font-family:'IBM Plex Mono',monospace;color:var(--mid)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;transition:opacity .8s}
  .ui *{pointer-events:auto}
  body.hide-ui .ui{opacity:0}
  body.hide-ui .ui *{pointer-events:none}
  .top,.bottom{padding:2.5rem 3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;
    font-size:.6rem;font-weight:300;letter-spacing:.3em;text-transform:uppercase}
  .top{opacity:0;animation:fi 2s .5s forwards}
  .bottom{align-items:flex-end;opacity:0;animation:fi 2s 1.2s forwards}
  a,button{color:var(--dim);text-decoration:none;background:none;border:none;font:inherit;
    letter-spacing:inherit;text-transform:inherit;cursor:pointer;transition:color .6s}
  a:hover,button:hover,button:focus-visible,a:focus-visible{color:var(--hi);outline:none}
  button[aria-pressed="true"]{color:var(--hi)}
  button:disabled{opacity:.4;cursor:default}
  .now{font-family:'Syne',sans-serif;font-weight:500;font-size:.75rem;letter-spacing:.25em;color:var(--mid);
    max-width:45ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .now:empty{display:none}
  .controls{display:flex;gap:1.8rem;flex-wrap:wrap}
  .status{max-width:40ch;text-align:right;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:1.2rem 2rem;
    font-size:.75rem;letter-spacing:.5em;text-transform:uppercase;color:var(--hi);background:rgba(0,0,0,.75);
    border:1px solid var(--dim);opacity:0;pointer-events:none;transition:opacity .6s}
  body.needs-tap .tap{opacity:1;pointer-events:auto}
  #scrub{position:fixed;top:auto;left:3rem;right:3rem;bottom:5.2rem;width:calc(100% - 6rem);height:64px;z-index:3;cursor:pointer;touch-action:none;background:transparent}
  body.hide-ui #scrub{opacity:.5}
  @media(max-width:700px){#scrub{left:16px;right:16px;width:calc(100% - 32px);bottom:9.5rem;height:48px}}
  .hint{position:fixed;left:50%;bottom:10rem;transform:translateX(-50%);font-size:.55rem;letter-spacing:.35em;
    text-transform:uppercase;color:var(--mid);white-space:nowrap;opacity:0;pointer-events:none;animation:hint 7s 2s forwards}
  @keyframes hint{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
  body.hide-ui .hint{display:none}
  .drop{position:fixed;inset:1.5rem;border:1px dashed var(--mid);display:flex;align-items:center;justify-content:center;
    font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--hi);opacity:0;pointer-events:none;transition:opacity .3s}
  body.dragging .drop{opacity:1}
  /* SoundCloud's player does the playing; it stays out of sight and the visualiser is the interface */
  #sc{position:fixed;left:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
  input[type=file]{display:none}
  @keyframes fi{to{opacity:1}}
  @media(max-width:700px){
    .top,.bottom{padding:1.25rem 1rem;font-size:.55rem;letter-spacing:.2em}
    .now{font-size:.65rem;max-width:60vw}
    .bottom{flex-direction:column;align-items:center;gap:1rem}
    .controls{gap:1.2rem;justify-content:center}
    .status{text-align:center;max-width:100%}
  }
</style>
</head>
<body>
<canvas id="plot"></canvas>

<div class="ui">
  <header class="top">
    <a href="../">&larr; James Norman</a>
    <a class="now" id="now" target="_blank" rel="noopener"></a>
  </header>
  <footer class="bottom">
    <div class="controls">
      <button id="playBtn" title="Play / pause (Space)" disabled>Play</button>
      <button id="loadBtn" title="Play an audio file from your device instead (L)">Load file</button>
      <button id="micBtn" title="Use your microphone (M)" aria-pressed="false">Mic</button>
      <button id="wildBtn" title="Wild camera on or off (C)" aria-pressed="true">Wild</button>
      <button id="strobeBtn" title="Strobe on the biggest drops (3 flashes, max 3 a second)" aria-pressed="true">Strobe</button>
      <button id="uiBtn" title="Hide interface (H)">Hide</button>
    </div>
    <div class="status" id="status">Loading</div>
  </footer>
</div>
<canvas id="scrub" hidden aria-label="Track waveform: click or drag to jump to a point in the track"></canvas>
<div class="hint" id="hint">Move to steer &middot; scroll to loop the loop</div>
<button class="tap" id="tap">&#9654; Play</button>
<div class="drop">Release to play</div>
<input type="file" id="file" accept="audio/*">

<script>
(() => {
'use strict';

/* ─── Settings ───────────────────────────────────────────── */
// Where the admin page's chosen song is kept (read-only key; safe to be public).
const SETTINGS_URL = 'https://ynhyylnsbvmdasyyalcg.supabase.co/rest/v1/jn_site_settings?key=eq.now_playing&select=value';
const SETTINGS_KEY = 'sb_publishable_hc4qj9_jLSC388ntEKhaLA_RBlGvA1v';
// If no song has been chosen, play the latest uploads from this profile.
const DEFAULT_SOUNDCLOUD = 'https://soundcloud.com/jamesnormal';
const SC_URL_RE = /^https:\/\/(www\.|m\.)?soundcloud\.com\/[^\s"<>]+$/;

const ROWS = 72;            // number of ridge lines
const POINTS = 160;         // samples per line
const ROW_RATE = 28;        // new lines per second while music plays
const FFT = 2048;
const MIN_HZ = 30, MAX_HZ = 9000;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ─── Canvas ─────────────────────────────────────────────── */
const cv = document.getElementById('plot');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

/* ─── History: ring buffer of rows ───────────────────────── */
const TOTAL = ROWS * 2;      // lines ahead of the ship and behind it (seen during loops)
const history = Array.from({ length: TOTAL }, () => new Float32Array(POINTS));
let head = 0, rowClock = 0;

const envelope = new Float32Array(POINTS);
for (let i = 0; i < POINTS; i++) {
  const d = (i / (POINTS - 1) - 0.5) * 2;
  envelope[i] = 0.12 + 0.88 * Math.exp(-(d * d) / (2 * 0.34 * 0.34));
}

/* Seeded random, so a given moment of a song always draws the same shape. */
function seeded(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let idleSeed = 1;

function bumps(row, rnd, level, kick) {
  row.fill(0);
  const n = 3 + ((rnd() * 4) | 0);
  for (let k = 0; k < n; k++) {
    const c = 0.5 + (rnd() - 0.5) * 0.34;
    const w = 0.008 + rnd() * 0.03;
    const a = (0.2 + rnd() * 0.8) * level + kick * rnd();
    for (let i = 0; i < POINTS; i++) {
      const x = i / (POINTS - 1) - c;
      row[i] += a * Math.exp(-(x * x) / (2 * w * w));
    }
  }
  for (let i = 0; i < POINTS; i++) row[i] = Math.min(row[i] + rnd() * 0.05 * (0.4 + level), 1.4);
}

/* ─── Source 1: SoundCloud ───────────────────────────────── */
let sc = null, scPlaying = false, scPos = 0, scPosAt = 0, scDuration = 0;
let scSoundId = null, wave = null, waveLo = 0, waveHi = 1, scReady = false;

async function chosenTrack() {
  const q = new URLSearchParams(location.search).get('track');   // ?track= lets the admin page preview
  if (q && SC_URL_RE.test(q)) return q;
  try {
    const r = await fetch(SETTINGS_URL, { headers: { apikey: SETTINGS_KEY }, cache: 'no-store' });
    const j = await r.json();
    const url = j && j[0] && j[0].value && j[0].value.url;
    if (url && SC_URL_RE.test(url)) return url;
  } catch (e) { /* fall through to default */ }
  return DEFAULT_SOUNDCLOUD;
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function startSoundCloud() {
  const url = await chosenTrack();
  try { await loadScript('https://w.soundcloud.com/player/api.js'); }
  catch (e) { setStatus('SoundCloud unavailable'); return; }

  const iframe = document.createElement('iframe');
  iframe.id = 'sc';
  iframe.title = 'SoundCloud player';
  iframe.allow = 'autoplay; encrypted-media';
  iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
    '&auto_play=true&hide_related=true&show_comments=false&show_reposts=false&visual=false';
  document.body.appendChild(iframe);

  const E = SC.Widget.Events;
  sc = SC.Widget(iframe);
  sc.bind(E.READY, () => {
    scReady = true;
    playBtn.disabled = false;
    readSound();
    if (source === 'idle') sc.play();
    // browsers block sound until the visitor interacts; ask for a tap if it didn't start
    setTimeout(() => { if (!scPlaying && source === 'idle') { document.body.classList.add('needs-tap'); setStatus('Tap to play'); } }, 1800);
  });
  sc.bind(E.PLAY, () => {
    scPlaying = true;
    document.body.classList.remove('needs-tap');
    if (audioEl && !audioEl.paused) audioEl.pause();
    stopMic();
    lastMedia = 'sc';
    readSound();
    setStatus('Playing from SoundCloud');
    playBtn.textContent = 'Pause';
  });
  sc.bind(E.PAUSE, () => { scPlaying = false; if (lastMedia === 'sc') { playBtn.textContent = 'Play'; setStatus('Paused'); } });
  sc.bind(E.FINISH, () => { scPlaying = false; });
  sc.bind(E.PLAY_PROGRESS, e => { scPos = e.currentPosition; scPosAt = performance.now(); });
  sc.bind(E.ERROR, () => setStatus('Couldn’t load that SoundCloud track'));
}

function readSound() {
  sc.getCurrentSound(s => {
    if (!s || s.id === scSoundId) return;
    scSoundId = s.id;
    scDuration = s.duration || s.full_duration || 0;
    nowEl.textContent = s.title || '';
    nowEl.href = s.permalink_url || DEFAULT_SOUNDCLOUD;
    nowEl.title = 'Listen on SoundCloud';
    loadWave(s.waveform_url);
  });
}

// SoundCloud publishes each track's loudness over time; it drives the lines in sync with playback.
async function loadWave(url) {
  wave = null;
  if (!url) return;
  try {
    let j = null;
    try { const r = await fetch('/api/waveform?wave=' + encodeURIComponent(url.split('?')[0])); if (r.ok) j = await r.json(); } catch (e) {}
    if (!j || !j.samples) j = await (await fetch(url.replace(/\.png(\?.*)?$/, '.json'))).json();
    const h = j.height || 140;
    wave = j.samples.map(v => v / h);
    const sorted = [...wave].sort((a, b) => a - b);
    waveLo = sorted[Math.floor(sorted.length * 0.05)];
    waveHi = sorted[Math.floor(sorted.length * 0.98)] || 1;
    breakMap = mapBreaks(wave, scDuration);
  } catch (e) { wave = null; }  // fall back to a steady pulse
}

// Live energy of the music, shared with the camera: level 0..1, hit = sudden jumps in loudness.
let energy = 0, hit = 0, rowCount = 0;

function sampleSoundCloud(row) {
  const pos = scPos + (scPlaying ? performance.now() - scPosAt : 0);
  const t = pos / 1000;
  let level, kick;
  if (wave && scDuration) {
    const n = wave.length, fi = Math.max(0, Math.min(n - 1.001, (pos / scDuration) * n));
    const i0 = Math.floor(fi), fr = fi - i0;
    const norm = v => Math.max(0, Math.min(1, (v - waveLo) / (waveHi - waveLo || 1)));
    level = norm(wave[i0]) * (1 - fr) + norm(wave[i0 + 1]) * fr;      // smooth between waveform points
    const span = Math.max(2, Math.round((2000 / scDuration) * n));     // the last ~2 seconds
    let avg = 0;
    for (let k = 1; k <= span; k++) avg += norm(wave[Math.max(0, i0 - k)]);
    kick = Math.max(0, level - avg / span) * 3;
  } else {
    const beat = (pos / 500) % 1;            // ~120 bpm pulse if the waveform isn't available
    level = 0.4 + 0.35 * Math.exp(-beat * 6);
    kick = Math.exp(-beat * 8) * 0.5;
  }
  shapeRow(row, t, level, kick);
}

// Peaks drift smoothly over time; loudness lifts them, hits throw up sharp spikes.
function shapeRow(row, t, level, kick) {
  row.fill(0);
  const r = seeded(++rowCount * 2654435761);
  for (let k = 0; k < 6; k++) {
    const c = 0.5 + 0.3 * Math.sin(t * (0.31 + 0.13 * k) + k * 1.7) + 0.05 * Math.sin(t * (1.9 + k * 0.4));
    const w = 0.01 + 0.022 * (0.5 + 0.5 * Math.sin(t * 0.7 + k * 2.1));
    const a = (0.15 + level * 0.95) * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * (1.1 + 0.37 * k) + k * 2.3)));
    for (let i = 0; i < POINTS; i++) { const x = i / (POINTS - 1) - c; row[i] += a * Math.exp(-(x * x) / (2 * w * w)); }
  }
  if (kick > 0.12) {
    for (let k = 0; k < 3; k++) {
      const c = 0.5 + (r() - 0.5) * 0.6, w = 0.004 + r() * 0.006, a = kick * (0.8 + r() * 0.9);
      for (let i = 0; i < POINTS; i++) { const x = i / (POINTS - 1) - c; row[i] += a * Math.exp(-(x * x) / (2 * w * w)); }
    }
  }
  for (let i = 0; i < POINTS; i++) row[i] = Math.min(row[i] + r() * 0.06 * (0.3 + level), 1.6);
}

/* ─── Source 2 & 3: local file / microphone (real frequency analysis) ── */
let actx = null, analyser = null, freq = null, binMap = null, timeBuf = null, specBuf = null;
let audioEl = null, micStream = null, micSource = null;
let lastMedia = 'sc';

function ensureAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = actx.createAnalyser();
  analyser.fftSize = FFT;
  analyser.smoothingTimeConstant = 0.55;
  analyser.minDecibels = -90;
  analyser.maxDecibels = -15;
  freq = new Uint8Array(analyser.frequencyBinCount);
  const nyq = actx.sampleRate / 2, bins = analyser.frequencyBinCount;
  binMap = new Float32Array(POINTS);
  for (let i = 0; i < POINTS; i++) {
    const t = i / (POINTS - 1);
    const d = Math.abs(t - 0.5) * 2;
    const skew = t < 0.5 ? 0.93 : 1.07;
    const hz = MIN_HZ * Math.pow(MAX_HZ / MIN_HZ, d) * skew;
    binMap[i] = Math.min(bins - 1, (hz / nyq) * bins);
  }
}

function sampleAnalyser(row) {
  analyser.getByteFrequencyData(freq);
  for (let i = 0; i < POINTS; i++) {
    const b = binMap[i], b0 = b | 0, f = b - b0;
    const v = (freq[b0] * (1 - f) + freq[Math.min(b0 + 1, freq.length - 1)] * f) / 255;
    row[i] = Math.pow(v, 1.6);
  }

}

function sampleIdle(row) {
  bumps(row, seeded(idleSeed++), 0.5, 0.1);
  energy = 0.25;
}

/* ─── Music analysis: kick, tempo, breaks and drops ───────── */
// Dance music breaks are where the kick drum drops out; the drop is where it comes back.
const music = { beat: 0.5, bpm: 0, lastKick: -99, kicks: [], breakTarget: 0, breakFor: 0, buildUp: 0, peak: 0.05, lowPeak: 1e-4 };
let breakMap = null, lowPrev = 0, fluxHist = [], liveT = 0;

// Live audio (local file or mic): detect kicks in the sub-bass, estimate tempo, flag breaks.
function analyseLive(dt) {
  liveT += dt;
  const n = analyser.fftSize, bins = analyser.frequencyBinCount;
  if (!timeBuf || timeBuf.length !== n) { timeBuf = new Float32Array(n); specBuf = new Float32Array(bins); }
  analyser.getFloatTimeDomainData(timeBuf);
  analyser.getFloatFrequencyData(specBuf);
  let sum = 0;
  for (let i = 0; i < n; i += 2) sum += timeBuf[i] * timeBuf[i];
  const rms = Math.sqrt(sum / (n / 2));
  music.peak = Math.max(rms, music.peak * Math.exp(-dt / 25), 0.01);      // self-adjusting loudness
  energy = Math.min(1, rms / music.peak);

  const hz = actx.sampleRate / n;
  let low = 0;
  for (let i = Math.max(1, Math.floor(40 / hz)); i <= Math.ceil(130 / hz); i++) low += Math.pow(10, specBuf[i] / 20);
  music.lowPeak = Math.max(low, music.lowPeak * Math.exp(-dt / 25), 1e-6);
  const flux = Math.max(0, low - lowPrev); lowPrev = low;
  fluxHist.push(flux); if (fluxHist.length > 90) fluxHist.shift();          // ~1.5 s of history
  const mean = fluxHist.reduce((a, b) => a + b, 0) / fluxHist.length;
  const sd = Math.sqrt(fluxHist.reduce((a, b) => a + (b - mean) ** 2, 0) / fluxHist.length);
  if (flux > mean + 1.6 * sd && flux > music.lowPeak * 0.08 && liveT - music.lastKick > 0.26) {
    music.lastKick = liveT;
    music.kicks.push(liveT);
    while (music.kicks.length && liveT - music.kicks[0] > 10) music.kicks.shift();
    hit = Math.max(hit, Math.min(1, flux / (music.lowPeak * 0.5)));
    // tempo: median gap between kicks, folded into 80–170 BPM
    const gaps = [];
    for (let i = 1; i < music.kicks.length; i++) {
      let g = music.kicks[i] - music.kicks[i - 1];
      while (g > 0.75) g /= 2;
      while (g < 0.353) g *= 2;
      gaps.push(g);
    }
    if (gaps.length >= 4) { gaps.sort((a, b) => a - b); music.beat = gaps[gaps.length >> 1]; music.bpm = Math.round(60 / music.beat); }
  }
  const kickGone = liveT - music.lastKick > Math.max(2.5 * music.beat, 1.2);
  const bassGone = low < music.lowPeak * 0.18;
  music.breakTarget = (kickGone || bassGone) && energy > 0.02 ? 1 : 0;
  music.buildUp = 0;
}

// SoundCloud: we only have the loudness outline, but we have all of it, so map the breaks in advance.
function mapBreaks(w, durMs) {
  const n = w.length, perSec = n / Math.max(1, durMs / 1000);
  const win = Math.max(1, Math.round(perSec * 2)), ctxN = Math.max(4, Math.round(perSec * 45));
  const sm = new Float32Array(n);
  for (let i = 0; i < n; i++) { let a = 0, c = 0; for (let k = -win; k <= win; k++) { const j = i + k; if (j >= 0 && j < n) { a += w[j]; c++; } } sm[i] = a / c; }
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    let ref = 0;                                           // the loud level of the surrounding ~minute
    for (let k = -ctxN; k <= ctxN; k += Math.max(1, ctxN >> 4)) { const j = i + k; if (j >= 0 && j < n && sm[j] > ref) ref = sm[j]; }
    out[i] = sm[i] < ref * 0.72 ? 1 : 0;
  }
  // ignore dips shorter than ~5 seconds
  const minLen = Math.max(2, Math.round(perSec * 5));
  for (let i = 0; i < n;) { if (!out[i]) { i++; continue; } let j = i; while (j < n && out[j]) j++; if (j - i < minLen) out.fill(0, i, j); i = j; }
  return out;
}

function analyseSC() {
  const pos = scPos + (scPlaying ? performance.now() - scPosAt : 0);
  if (!(wave && scDuration)) { energy = 0.5; music.breakTarget = 0; music.buildUp = 0; return; }
  const n = wave.length, fi = Math.max(0, Math.min(n - 1.001, (pos / scDuration) * n)), i0 = Math.floor(fi), fr = fi - i0;
  const norm = v => Math.max(0, Math.min(1, (v - waveLo) / (waveHi - waveLo || 1)));
  const level = norm(wave[i0]) * (1 - fr) + norm(wave[i0 + 1]) * fr;
  const span = Math.max(2, Math.round((2000 / scDuration) * n));
  let avg = 0; for (let k = 1; k <= span; k++) avg += norm(wave[Math.max(0, i0 - k)]);
  hit = Math.max(hit, Math.max(0, level - avg / span) * 3);
  energy = level;
  music.breakTarget = breakMap ? breakMap[i0] : 0;
  // see the drop coming: in the last 3 seconds of a break, build up
  const ahead = Math.round((3000 / scDuration) * n);
  music.buildUp = breakMap && breakMap[i0] && i0 + ahead < n && !breakMap[i0 + ahead] ? 1 : 0;
}

function analyse(dt) {
  if (source === 'file' || source === 'mic') analyseLive(dt);
  else if (source === 'sc') analyseSC();
  else { energy = 0.25; music.breakTarget = 0; music.buildUp = 0; }
  // break bookkeeping and the drop
  if (music.breakTarget) music.breakFor += dt;
  else {
    if (music.breakFor > 4) onDrop(music.breakFor);
    music.breakFor = 0;
  }
}

/* ─── Which source is driving the picture ────────────────── */
let source = 'idle';
function currentSource() {
  if (micStream) return 'mic';
  if (audioEl && !audioEl.paused) return 'file';
  if (scPlaying) return 'sc';
  return 'idle';
}

/* ─── Flight: camera, steering, speed ────────────────────── */
// The ridge lines are a landscape in 3D. New lines appear at the horizon and
// rush towards you; nearer lines move faster than far ones (parallax).
const NEAR = 0.22, FAR = 14, SPAN = FAR - NEAR;
const ROW_W = 7.5;            // width of the active part of each line (world units)
const AMP = 0.95;             // height of the tallest peaks
const CAM_X = 2.8, CAM_LO = 0.12, CAM_HI = 2.4;
const cam = { x: 0, y: 0.62, tx: 0, ty: 0.62, roll: 0, speed: 1, tspeed: 1, spin: 0, spinV: 0, zoom: 1, shake: 0, tilt: 0, loop: 0, loopTo: 0 };
const TAU = Math.PI * 2, LOOP_R = 1.3;
let lastLoop = 0;
// queue a full loop-the-loop: dir 1 = forward (nose up and over), -1 = backward
function loopTheLoop(dir) {
  const queued = (cam.loopTo - cam.loop) * dir;
  if (queued < TAU * 2.5) cam.loopTo += dir * TAU;
}
const keys = new Set();
let lastInput = -1e9, calm = reduceMotion, lastRoll = 0, clockT = 0, inBreak = 0, autoNow = false;
// The drop: punch, surge, loop the loop; a big break (4 bars+) earns the strobe.
function onDrop(breakLen) {
  hit = 1;
  if (breakLen >= Math.max(6, 16 * music.beat)) strobe();          // a big break: 4 bars or more
  if (autoNow) { loopTheLoop(1); lastLoop = clockT; cam.tspeed = 3.2; }
}
const touched = () => { lastInput = performance.now(); };

function steerTo(clientX, clientY) {
  cam.tx = ((clientX / W) - 0.5) * 2 * CAM_X;
  cam.ty = CAM_LO + (1 - clientY / H) * (CAM_HI - CAM_LO);
}
addEventListener('pointermove', e => {
  if (scrubbing || e.target === scrub) return;
  if (e.pointerType === 'mouse' || e.buttons) { steerTo(e.clientX, e.clientY); touched(); }
});
addEventListener('pointerdown', e => { if (e.target === scrub) return; if (e.pointerType !== 'mouse') { steerTo(e.clientX, e.clientY); touched(); } });
// mouse wheel: loop the loop (down = forward, up = backward); each flick is a full loop
let wheelAcc = 0, wheelAt = 0;
addEventListener('wheel', e => {
  if (e.target === scrub) return;
  touched();
  const now = performance.now();
  if (now - wheelAt > 350) wheelAcc = 0;
  wheelAt = now;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) > 40) { loopTheLoop(wheelAcc > 0 ? 1 : -1); wheelAcc = -1e6 * Math.sign(wheelAcc); }
}, { passive: true });
let lastTap = 0;
addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' || e.target !== cv) return;
  const now = performance.now();
  if (now - lastTap < 320) loopTheLoop(1);          // double-tap on a phone: loop the loop
  lastTap = now;
});

function updateCamera(dt) {
  clockT += dt;
  const step = dt * 1.6;
  if (keys.size) touched();
  const auto = !calm && performance.now() - lastInput > 2500;
  // ease into a break once it has lasted a couple of seconds
  const breakNow = music.breakTarget && music.breakFor > 1.5 ? 1 : 0;
  inBreak += (breakNow - inBreak) * Math.min(1, dt * 2);
  autoNow = auto;
  if (auto && music.buildUp) {
    // the drop is coming: dive and accelerate into it
    cam.tx = 0; cam.ty = CAM_LO + 0.1; cam.tspeed = 2.4;
  } else if (auto && inBreak > 0.3) {
    // breakdown: slow right down, climb high and float
    cam.tx = Math.sin(clockT * 0.15) * 0.5;
    cam.ty = CAM_HI * (0.75 + 0.15 * Math.sin(clockT * 0.4));
    cam.tspeed = 0.3 + (1 - inBreak) * 0.6;
  } else if (auto) {
    // swoop side to side, dive into the peaks and climb out, faster when the music is loud
    const t = clockT, e = energy;
    cam.tx = Math.sin(t * 0.37 + Math.sin(t * 0.13) * 2) * (0.6 + e * 0.9) * CAM_X / 1.5;
    cam.ty = CAM_LO + (0.5 + 0.5 * Math.sin(t * 0.29 + 1 + Math.sin(t * 0.07) * 3)) * (CAM_HI - CAM_LO) * (0.6 + e * 0.4);
    cam.tspeed = Math.min(3.2, 0.7 + e * 1.6 + hit * 1.5);
    // barrel roll on a big hit (not too often)
    if (hit > 0.45 && clockT - lastRoll > 5) { lastRoll = clockT; cam.spinV = (Math.random() < 0.5 ? -1 : 1) * Math.PI * 2 / 1.1; }
  }
  if (!calm) {
    cam.zoom += ((1 + hit * 0.35 - inBreak * 0.12) - cam.zoom) * Math.min(1, dt * 12);   // punch in on hits, pull back in breaks
    cam.shake = hit * 7;
    cam.tilt = auto ? Math.sin(clockT * 0.21) * 0.08 : 0;                        // horizon wanders
  } else { cam.zoom = 1; cam.shake = 0; cam.tilt = 0; }
  if (auto && hit > 0.75 && clockT - lastLoop > 18) { lastLoop = clockT; loopTheLoop(Math.random() < 0.75 ? 1 : -1); }
  const left = cam.loopTo - cam.loop;
  if (left) {
    const v = 2.7 * Math.max(0.3, Math.min(1, Math.abs(left) / 1.4, Math.abs(cam.loop - Math.round(cam.loop / TAU) * TAU) / 1.4 + 0.3));
    cam.loop += Math.sign(left) * Math.min(Math.abs(left), v * dt);
    if (cam.loop === cam.loopTo) { cam.loop = cam.loopTo = 0; }
  }
  if (cam.spinV) {
    cam.spin += cam.spinV * dt;
    if (Math.abs(cam.spin) >= Math.PI * 2) { cam.spin = 0; cam.spinV = 0; }
  }
  hit *= Math.exp(-dt * 4);
  if (keys.has('arrowleft') || keys.has('a')) cam.tx -= step * CAM_X;
  if (keys.has('arrowright') || keys.has('d')) cam.tx += step * CAM_X;
  if (keys.has('arrowup') || keys.has('w')) cam.ty += step;
  if (keys.has('arrowdown') || keys.has('s')) cam.ty -= step;
  cam.tx = Math.max(-CAM_X, Math.min(CAM_X, cam.tx));
  cam.ty = Math.max(CAM_LO, Math.min(CAM_HI, cam.ty));

  const k = 1 - Math.exp(-dt * 2.5);
  const prevX = cam.x;
  cam.x += (cam.tx - cam.x) * k;
  cam.y += (cam.ty - cam.y) * k;
  cam.speed += (cam.tspeed - cam.speed) * k;
  const vx = (cam.x - prevX) / Math.max(dt, 1e-3);
  const bank = calm ? 0.35 : 0.7;
  const targetRoll = reduceMotion ? 0 : Math.max(-bank, Math.min(bank, -vx * (calm ? 0.12 : 0.3)));
  cam.roll += (targetRoll - cam.roll) * k;
}

/* ─── Render ─────────────────────────────────────────────── */
const tmp = new Float32Array(POINTS);
const INK = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
let last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  source = currentSource();
  analyse(dt);
  updateCamera(dt);
  const base = source !== 'idle' ? ROW_RATE : (reduceMotion ? 3 : 10);

  rowClock += dt * base * cam.speed;
  while (rowClock >= 1) {
    rowClock -= 1;
    head = (head + 1) % TOTAL;
    const row = history[head];
    if (source === 'sc') sampleSoundCloud(row);
    else if (source === 'file' || source === 'mic') sampleAnalyser(row);
    else sampleIdle(row);
    for (let i = 0; i < POINTS; i++) {
      tmp[i] = (row[Math.max(i - 1, 0)] + row[i] * 2 + row[Math.min(i + 1, POINTS - 1)]) / 4;
    }
    for (let i = 0; i < POINTS; i++) row[i] = tmp[i] * envelope[i];
  }

  draw(rowClock);
  requestAnimationFrame(frame);
}

const sx = new Float32Array(POINTS + 4), sy = new Float32Array(POINTS + 4);
const order = [];

// Project a world point (x across, h height, z depth) through the camera, which can pitch through a full loop.
function draw(phase) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.translate(W / 2 + (Math.random() - 0.5) * cam.shake, H / 2 + (Math.random() - 0.5) * cam.shake);
  ctx.rotate(cam.roll + cam.spin);
  ctx.translate(-W / 2, -H / 2);

  const f = Math.max(W * 0.55, H * 0.75) * cam.zoom;
  const cy = H * (0.34 + cam.tilt);
  const th = cam.loop, cs = Math.cos(th), sn = Math.sin(th);
  const camY = cam.y + LOOP_R * (1 - cs), camZ = LOOP_R * sn;     // the ship's path round the loop
  const gap = SPAN / ROWS, SKIRT = -1.6, EXT = 30;

  // depth of every line from the ship, so we can paint far to near in any direction
  order.length = 0;
  for (let a = 0; a < TOTAL; a++) {
    const z = FAR - (a + phase) * gap;
    const zc = -camY * sn + (z - camZ) * cs;
    if (zc > NEAR && zc < FAR + 2) order.push([zc, a, z]);
  }
  order.sort((p, q) => q[0] - p[0]);

  ctx.lineJoin = 'round';
  ctx.strokeStyle = INK;
  ctx.fillStyle = '#000';
  for (const [zc0, a, z] of order) {
    const row = history[(head - a + TOTAL * 2) % TOTAL];
    const Z = z - camZ;
    let ok = true;
    const proj = (x, h, k) => {
      const X = x - cam.x, Y = h - camY;
      const zc = Y * sn + Z * cs;
      if (zc < 0.05) { ok = false; return; }
      sx[k] = W / 2 + X * f / zc;
      sy[k] = cy - (Y * cs - Z * sn) * f / zc;
    };
    proj(-EXT, 0, 0);
    for (let i = 0; i < POINTS; i++) proj((i / (POINTS - 1) - 0.5) * ROW_W, row[i] * AMP, i + 1);
    proj(EXT, 0, POINTS + 1);
    proj(EXT, SKIRT, POINTS + 2);
    proj(-EXT, SKIRT, POINTS + 3);
    if (!ok) continue;

    // see-through: white lines only, nothing hidden behind
    ctx.globalAlpha = Math.max(0, Math.min((FAR - zc0) / (SPAN * 0.4), (zc0 - NEAR) / 0.35, 1));
    ctx.lineWidth = Math.min(3, Math.max(0.6, 0.35 * f / zc0 / 100));
    ctx.beginPath();
    ctx.moveTo(sx[0], sy[0]);
    for (let k = 1; k < POINTS + 2; k++) ctx.lineTo(sx[k], sy[k]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  drawScrub();
}

/* ─── Strobe: everything inverts, white to black and black to white ── */
// Kept to 3 flashes, never faster than 3 a second (photosensitivity safety), and off for reduced motion.
let strobeOn = !reduceMotion, strobing = false;
function strobe() {
  if (!strobeOn || strobing || calm) return;
  strobing = true;
  const root = document.documentElement;
  [0, 340, 680].forEach(t => {
    setTimeout(() => { root.style.filter = 'invert(1)'; }, t);
    setTimeout(() => { root.style.filter = ''; }, t + 120);
  });
  setTimeout(() => { strobing = false; }, 1200);
}

/* ─── Seek waveform: see-through, white lines only ───────── */
const scrub = document.getElementById('scrub');
const sctx = scrub.getContext('2d');
let scrubbing = false, filePeaks = null;
function trackInfo() {
  if (lastMedia === 'file' && audioEl && audioEl.src && filePeaks && audioEl.duration) {
    return { peaks: filePeaks, frac: audioEl.currentTime / audioEl.duration };
  }
  if (wave && scDuration) {
    const pos = scPos + (scPlaying ? performance.now() - scPosAt : 0);
    return { peaks: wave, frac: Math.min(1, pos / scDuration), lo: waveLo, hi: waveHi };
  }
  return null;
}
function drawScrub() {
  const info = trackInfo();
  scrub.hidden = !info;
  if (!info) return;
  const r = scrub.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  if (scrub.width !== Math.round(r.width * d)) { scrub.width = Math.round(r.width * d); scrub.height = Math.round(r.height * d); }
  sctx.setTransform(d, 0, 0, d, 0, 0);
  sctx.clearRect(0, 0, r.width, r.height);
  const n = info.peaks.length, step = 3, mid = r.height / 2, lo = info.lo || 0, hi = info.hi || 1;
  sctx.lineWidth = 1;
  for (let x = 0; x < r.width; x += step) {
    const v = info.peaks[Math.min(n - 1, Math.floor((x / r.width) * n))];
    const a = Math.max(0.06, Math.min(1, (v - lo) / (hi - lo || 1))) * (mid - 1);
    sctx.strokeStyle = x / r.width <= info.frac ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.3)';
    sctx.beginPath(); sctx.moveTo(x + 0.5, mid - a); sctx.lineTo(x + 0.5, mid + a); sctx.stroke();
  }
  const px = Math.round(info.frac * r.width) + 0.5;
  sctx.strokeStyle = '#fff';
  sctx.beginPath(); sctx.moveTo(px, 0); sctx.lineTo(px, r.height); sctx.stroke();
}
function seekTo(clientX) {
  const r = scrub.getBoundingClientRect(), frac = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  if (lastMedia === 'file' && audioEl && audioEl.duration) { audioEl.currentTime = frac * audioEl.duration; return; }
  if (sc && scDuration) { const ms = frac * scDuration; sc.seekTo(ms); scPos = ms; scPosAt = performance.now(); }
}
scrub.addEventListener('pointerdown', e => { scrubbing = true; scrub.setPointerCapture(e.pointerId); seekTo(e.clientX); e.preventDefault(); });
scrub.addEventListener('pointermove', e => { if (scrubbing) seekTo(e.clientX); });
scrub.addEventListener('pointerup', () => { scrubbing = false; });
scrub.addEventListener('pointercancel', () => { scrubbing = false; });

// A local file's waveform, worked out in the browser.
async function filePeaksFrom(file) {
  try {
    const buf = await (new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 2, 44100)).decodeAudioData(await file.arrayBuffer());
    const data = buf.getChannelData(0), n = 1200, size = Math.floor(data.length / n), out = new Array(n);
    for (let i = 0; i < n; i++) { let m = 0; for (let j = i * size, e = j + size; j < e; j += 8) { const v = Math.abs(data[j]); if (v > m) m = v; } out[i] = m; }
    return out;
  } catch (e) { return null; }
}

/* ─── UI wiring ──────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const statusEl = $('status'), playBtn = $('playBtn'), micBtn = $('micBtn'), fileInput = $('file'), nowEl = $('now');
const setStatus = s => { statusEl.textContent = s; statusEl.title = s; };

function stopMic() {
  if (!micStream) return;
  micStream.getTracks().forEach(t => t.stop());
  micSource && micSource.disconnect();
  micStream = micSource = null;
  micBtn.setAttribute('aria-pressed', 'false');
}

function loadFile(file) {
  if (!file || !file.type.startsWith('audio/')) { setStatus('That isn’t an audio file'); return; }
  ensureAudio();
  stopMic();
  if (sc && scPlaying) sc.pause();
  if (!audioEl) {
    audioEl = new Audio();
    audioEl.loop = true;
    actx.createMediaElementSource(audioEl).connect(analyser);
    analyser.connect(actx.destination);
    audioEl.addEventListener('play', () => { playBtn.textContent = 'Pause'; });
    audioEl.addEventListener('pause', () => { if (lastMedia === 'file') playBtn.textContent = 'Play'; });
  } else if (audioEl.src) {
    URL.revokeObjectURL(audioEl.src);
  }
  audioEl.src = URL.createObjectURL(file);   // stays on this device; nothing is uploaded
  filePeaks = null;
  filePeaksFrom(file).then(p => { filePeaks = p; });
  lastMedia = 'file';
  playBtn.disabled = false;
  document.body.classList.remove('needs-tap');
  nowEl.textContent = file.name.replace(/\.[^.]+$/, '');
  nowEl.removeAttribute('href');
  setStatus('Playing a local file');
  actx.resume();
  audioEl.play().catch(() => setStatus('Press play to start'));
}

function togglePlay() {
  stopMic();
  if (lastMedia === 'file' && audioEl && audioEl.src) {
    actx.resume();
    audioEl.paused ? audioEl.play() : audioEl.pause();
  } else if (sc && scReady) {
    scPlaying ? sc.pause() : sc.play();
  }
}

async function toggleMic() {
  if (micStream) { stopMic(); setStatus('Mic off'); return; }
  ensureAudio();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    if (audioEl) audioEl.pause();
    if (sc && scPlaying) sc.pause();
    micStream = stream;
    micSource = actx.createMediaStreamSource(stream);
    micSource.connect(analyser);            // not to the speakers, to avoid feedback
    await actx.resume();
    micBtn.setAttribute('aria-pressed', 'true');
    playBtn.textContent = 'Play';
    setStatus('Listening');
  } catch (e) {
    setStatus('Microphone unavailable');
  }
}

function toggleUI() { document.body.classList.toggle('hide-ui'); }

function tapToPlay() {
  if (document.body.classList.contains('needs-tap') && sc) { sc.play(); return true; }
  return false;
}

$('tap').addEventListener('click', tapToPlay);
$('loadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { loadFile(fileInput.files[0]); fileInput.value = ''; });
playBtn.addEventListener('click', togglePlay);
micBtn.addEventListener('click', toggleMic);
$('uiBtn').addEventListener('click', toggleUI);
function toggleWild() { calm = !calm; $('wildBtn').setAttribute('aria-pressed', String(!calm)); $('wildBtn').textContent = calm ? 'Calm' : 'Wild'; }
$('wildBtn').addEventListener('click', toggleWild);
function syncStrobe() { $('strobeBtn').setAttribute('aria-pressed', String(strobeOn)); $('strobeBtn').textContent = strobeOn ? 'Strobe' : 'No strobe'; }
$('strobeBtn').addEventListener('click', () => { strobeOn = !strobeOn; syncStrobe(); });
syncStrobe();
if (calm) { $('wildBtn').setAttribute('aria-pressed', 'false'); $('wildBtn').textContent = 'Calm'; }
cv.addEventListener('click', () => { if (!tapToPlay()) document.body.classList.remove('hide-ui'); });

addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d'].includes(k)) { e.preventDefault(); keys.add(k); return; }
  if (k === '+' || k === '=') { cam.tspeed = Math.min(3, cam.tspeed * 1.2); return; }
  if (k === '-' || k === '_') { cam.tspeed = Math.max(0.3, cam.tspeed / 1.2); return; }
  if (k === ' ') { e.preventDefault(); if (!tapToPlay()) togglePlay(); }
  else if (k === 'h') toggleUI();
  else if (k === 'c') toggleWild();
  else if (k === 'm') toggleMic();
  else if (k === 'l') fileInput.click();
  else if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  else if (k === 'escape') document.body.classList.remove('hide-ui');
});

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  loadFile(e.dataTransfer.files[0]);
});

for (let r = 0; r < TOTAL; r++) {
  head = (head + 1) % TOTAL;
  sampleIdle(history[head]);
  for (let i = 0; i < POINTS; i++) history[head][i] *= envelope[i];
}
if (matchMedia('(pointer: coarse)').matches) $('hint').textContent = 'Drag to steer · double-tap to loop';
requestAnimationFrame(frame);
startSoundCloud();
})();
</script>
<script src="/assets/konami.js"></script>
</body>
