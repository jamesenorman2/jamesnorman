<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — James Norman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#000;--fg:#fff;--dim:#6a6a6a;--line:#2a2a2a;--err:#ff6b5a;--ok:#9be29b}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Mono',monospace;font-weight:300;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:4rem 16px}
  main{width:100%;max-width:560px}
  h1{font-family:'Syne',sans-serif;font-weight:500;font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:.5rem}
  .sub{color:var(--dim);font-size:.75rem;margin-bottom:2.5rem;line-height:1.6}
  label{display:block;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-bottom:.6rem}
  input{width:100%;background:transparent;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:.9rem;
    padding:.8rem .9rem;border-radius:0;outline:none;transition:border-color .3s}
  input:focus{border-color:var(--fg)}
  .row{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
  button,.btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);font:inherit;font-size:.7rem;
    letter-spacing:.25em;text-transform:uppercase;padding:.8rem 1.2rem;cursor:pointer;text-decoration:none;transition:opacity .3s}
  button.ghost,.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
  button.ghost:hover,.btn.ghost:hover{border-color:var(--fg)}
  button:disabled{opacity:.4;cursor:default}
  .msg{font-size:.75rem;min-height:1.4em;margin-top:1rem}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .card{border:1px solid var(--line);padding:1.2rem;margin:0 0 2.5rem}
  .card .k{font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem}
  .card .v{font-size:.85rem;word-break:break-word}
  .card a{color:var(--fg)}
  #preview{margin-top:1.5rem}
  #preview iframe{width:100%;height:166px;border:0;display:block}
  [hidden]{display:none!important}
  .back{display:inline-block;margin-top:3rem;color:var(--dim);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
  .back:hover{color:var(--fg)}
</style>
</head>
<body>
<main>
  <h1>Admin</h1>
  <p class="sub">Choose the SoundCloud song the visualiser plays.</p>

  <form id="login">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="row"><button type="submit">Sign in</button></div>
    <div class="msg" id="loginMsg" role="status"></div>
  </form>

  <section id="panel" hidden>
    <div class="card">
      <div class="k">Now playing on the site</div>
      <div class="v" id="current">…</div>
    </div>

    <form id="trackForm">
      <label for="url">SoundCloud track link</label>
      <input id="url" type="url" placeholder="https://soundcloud.com/jamesnormal/track-name" required>
      <div class="row">
        <button type="button" class="ghost" id="previewBtn">Preview</button>
        <button type="submit" id="saveBtn" disabled>Save</button>
        <button type="button" class="ghost" id="latestBtn">Use my latest uploads</button>
      </div>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <div id="preview"></div>

    <div class="card" style="margin-top:2.5rem">
      <div class="k">Track list for the DJ agents</div>
      <div class="v" id="catalogue">…</div>
      <div class="row"><button type="button" class="ghost" id="syncBtn">Sync my SoundCloud tracks</button></div>
      <div class="msg" id="syncMsg" role="status"></div>
    </div>

    <div class="card">
      <div class="k">Night Shift</div>
      <div class="v">Runs automatically at 05:00 UTC. Run it now to test, or after syncing new tracks.</div>
      <div class="row"><button type="button" class="ghost" id="shiftBtn">Run night shift now</button></div>
      <div class="msg" id="shiftMsg" role="status"></div>
    </div>
    <div id="syncBox" style="position:absolute;left:-9999px;top:0;width:300px;height:166px" aria-hidden="true"></div>

    <a class="back" href="../visualiser/" target="_blank" rel="noopener">Open visualiser &nearr;</a>
  </section>
</main>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(() => {
'use strict';
const API = 'https://ynhyylnsbvmdasyyalcg.supabase.co/rest/v1';
const KEY = 'sb_publishable_hc4qj9_jLSC388ntEKhaLA_RBlGvA1v';
const SC_URL_RE = /^https:\/\/(www\.|m\.)?soundcloud\.com\/[^\s"<>]+$/;
const $ = id => document.getElementById(id);

let password = '';           // kept in memory only, for this tab
let previewed = null;        // { url, title } once the preview has loaded

async function rpc(fn, body) {
  const r = await fetch(`${API}/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Server error ' + r.status);
  return r.json();
}

function say(el, text, kind) { el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); }

async function showCurrent() {
  try {
    const r = await fetch(`${API}/jn_site_settings?key=eq.now_playing&select=value,updated_at`, { headers: { apikey: KEY }, cache: 'no-store' });
    const [row] = await r.json();
    const v = row && row.value;
    const cur = $('current');
    cur.textContent = '';
    if (v && v.url) {
      const a = document.createElement('a');
      a.href = v.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = v.title || v.url;
      cur.append(a);
    } else {
      cur.textContent = 'Your latest SoundCloud uploads (no song chosen)';
    }
  } catch (e) { $('current').textContent = 'Couldn’t load the current setting'; }
}

$('login').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('loginMsg');
  say(msg, 'Checking…');
  try {
    const res = await rpc('jn_admin_login', { p_password: $('pw').value });
    if (!res.ok) { say(msg, res.error || 'Wrong password', 'err'); return; }
    password = $('pw').value;
    $('login').hidden = true;
    $('panel').hidden = false;
    showCurrent();
    showCatalogue();
    $('url').focus();
  } catch (err) { say(msg, 'Couldn’t reach the server. Try again.', 'err'); }
});

$('url').addEventListener('input', () => { previewed = null; $('saveBtn').disabled = true; say($('msg'), ''); });

$('previewBtn').addEventListener('click', () => {
  const url = $('url').value.trim().split('?')[0];
  const msg = $('msg');
  if (!SC_URL_RE.test(url)) { say(msg, 'Paste a link that starts with https://soundcloud.com/', 'err'); return; }
  say(msg, 'Loading preview…');
  const box = $('preview');
  box.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.allow = 'autoplay';
  iframe.title = 'SoundCloud preview';
  iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) + '&auto_play=false&hide_related=true&show_comments=false&visual=false';
  box.append(iframe);
  const w = SC.Widget(iframe);
  let done = false;
  w.bind(SC.Widget.Events.READY, () => {
    w.getCurrentSound(s => {
      done = true;
      if (!s) { say(msg, 'SoundCloud couldn’t find that track. Is it public?', 'err'); return; }
      previewed = { url, title: s.title || '' };
      $('saveBtn').disabled = false;
      say(msg, `Found “${s.title}”. Press Save to put it on the site.`, 'ok');
    });
  });
  w.bind(SC.Widget.Events.ERROR, () => { done = true; say(msg, 'SoundCloud couldn’t load that link.', 'err'); });
  setTimeout(() => { if (!done) say(msg, 'Still loading… if nothing appears, check the link is public.', ''); }, 6000);
});

async function save(url, title) {
  const msg = $('msg');
  say(msg, 'Saving…');
  try {
    const res = await rpc('jn_set_track', { p_password: password, p_url: url, p_title: title });
    if (!res.ok) { say(msg, res.error || 'Couldn’t save', 'err'); return; }
    say(msg, url ? 'Saved. Visitors will hear it next time they open the visualiser.' : 'Saved. The visualiser will play your latest uploads.', 'ok');
    showCurrent();
  } catch (e) { say(msg, 'Couldn’t reach the server. Try again.', 'err'); }
}

$('trackForm').addEventListener('submit', e => {
  e.preventDefault();
  if (previewed) save(previewed.url, previewed.title);
});
$('latestBtn').addEventListener('click', () => save(null, null));

/* ─── Track list for the DJ agents ─────────────────────── */
async function showCatalogue() {
  try {
    const r = await fetch(`${API}/jn_site_settings?key=eq.catalogue&select=value,updated_at`, { headers: { apikey: KEY }, cache: 'no-store' });
    const [row] = await r.json();
    $('catalogue').textContent = row && Array.isArray(row.value)
      ? `${row.value.length} tracks, last synced ${new Date(row.updated_at).toLocaleString()}`
      : 'Not synced yet';
  } catch (e) { $('catalogue').textContent = 'Couldn’t load'; }
}

$('syncBtn').addEventListener('click', () => {
  const msg = $('syncMsg');
  say(msg, 'Reading your SoundCloud…');
  $('syncBtn').disabled = true;
  const box = $('syncBox');
  box.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent('https://soundcloud.com/jamesnormal') + '&auto_play=false&visual=false';
  box.append(iframe);
  const w = SC.Widget(iframe);
  const collect = () => new Promise(res => w.getSounds(list => res((list || []).filter(s => s && s.title && s.permalink_url))));
  w.bind(SC.Widget.Events.READY, async () => {
    // the player loads tracks in batches; read twice and keep the longer list
    let best = await collect();
    await new Promise(r => setTimeout(r, 2500));
    const again = await collect();
    if (again.length > best.length) best = again;
    const tracks = best.map(s => ({ title: s.title, url: s.permalink_url.split('?')[0], duration: s.duration || 0 }));
    if (!tracks.length) { say(msg, 'No public tracks found on your SoundCloud.', 'err'); $('syncBtn').disabled = false; return; }
    try {
      const res = await rpc('jn_set_catalogue', { p_password: password, p_tracks: tracks });
      if (!res.ok) say(msg, res.error || 'Couldn’t save', 'err');
      else { say(msg, `Synced ${res.count} tracks.`, 'ok'); showCatalogue(); }
    } catch (e) { say(msg, 'Couldn’t reach the server. Try again.', 'err'); }
    $('syncBtn').disabled = false;
    box.innerHTML = '';
  });
});

$('shiftBtn').addEventListener('click', async () => {
  const msg = $('shiftMsg');
  say(msg, 'Crew clocking on… this can take up to a minute.');
  $('shiftBtn').disabled = true;
  try {
    const r = await fetch('/api/night-shift', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    const res = await r.json();
    if (!res.ok) say(msg, res.error || 'The shift didn’t run.', 'err');
    else say(msg, res.note ? `Shift logged. ${res.note}` : `Shift logged. Status ${res.status}. See the Night Shift page.`, res.note ? '' : 'ok');
  } catch (e) { say(msg, 'Couldn’t reach the server. Try again.', 'err'); }
  $('shiftBtn').disabled = false;
});
})();
</script>
</body>
</html>
