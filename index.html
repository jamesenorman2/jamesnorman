<style>
  html{font-size:16px}
  /* text scale: the same as a laptop up to 1440p, a touch larger on very wide screens */
  @media(min-width:2500px){html{font-size:17px}}
  @media(min-width:3200px){html{font-size:20px}}
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#000;
    --ink:#fff;
    --dim:#8a8070;
    --mid:#a09680;
    --hi:#f0e6cc;
  }
  html,body{height:100%}
  body{background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;
    font-family:'IBM Plex Mono',monospace;color:var(--mid)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;transition:opacity .8s}
  .ui *{pointer-events:auto}
  body.hide-ui .ui{opacity:0}
  body.hide-ui .ui *{pointer-events:none}
  .top,.bottom{padding:2.5rem 3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;
    font-size:.7rem;font-weight:300;letter-spacing:.3em;text-transform:uppercase}
  .top{opacity:0;animation:fi 2s .5s forwards;flex-direction:column;justify-content:flex-start;gap:1.1rem}
  .nameslot{font-family:'Syne',sans-serif;font-weight:500;font-size:clamp(1.3rem,3.2vw,2.3rem);letter-spacing:.14em;color:#fff;line-height:1;white-space:nowrap;visibility:hidden}
  .nameslot .sl{display:inline-block} .nameslot .dim{opacity:.55} .nameslot .gap{display:inline-block;width:.45em}
  body.name-landed .nameslot{visibility:visible}
  .bottom{align-items:flex-end;opacity:0;animation:fi 2s 1.2s forwards}
  a,button{color:var(--dim);text-decoration:none;background:none;border:none;font:inherit;
    letter-spacing:inherit;text-transform:inherit;cursor:pointer;transition:color .6s}
  a:hover,button:hover,button:focus-visible,a:focus-visible{color:var(--hi);outline:none}
  button[aria-pressed="true"]{color:var(--hi)}
  button:disabled{opacity:.4;cursor:default}
  .now{font-family:'Syne',sans-serif;font-weight:500;font-size:.75rem;letter-spacing:.2em;color:var(--mid);line-height:1.45;
    max-width:min(62ch,48vw);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:right}
  .now:empty{display:none}
  .controls{display:flex;gap:1.8rem;flex-wrap:wrap}
  .controls button{padding:.7rem 0;min-height:32px}
  .status{max-width:min(62ch,48vw);text-align:right;color:var(--mid);line-height:1.5;letter-spacing:.2em}
  /* if the browser blocks autoplay, the wireframe play button pulses instead of a big button in the middle */
  body.needs-tap #playBtn{animation:ppPulse 1.6s ease-in-out infinite;opacity:1}
  /* the big wireframe play in the middle: shown whenever nothing is playing, gone once the music starts */
  .bigplay{position:fixed;left:50%;top:auto;bottom:calc(5.2rem + 4rem + .6rem);transform:translate(-50%,0) scale(.92);z-index:5;display:flex;flex-direction:column;align-items:center;gap:.9rem;
    background:none;border:0;color:#fff;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s}
  body.intro-done:not(.is-playing) .bigplay,body.sc-ready:not(.is-playing) .bigplay{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
  @media(max-width:700px){.bigplay{bottom:calc(9.5rem + 48px + 3.8rem)}}
  body.hide-ui .bigplay{opacity:0!important;pointer-events:none!important}
  .bigplay svg{width:clamp(64px,6vw,6rem);height:auto;fill:none;stroke:#fff;stroke-width:1.2;stroke-linejoin:round;transition:transform .4s}
  /* fully inverted: the disc flips whatever is behind it, and the play triangle is cut out of it */
  .bigplay svg{mix-blend-mode:difference}
  .bigplay .disc{fill:#fff;stroke:none}
  .bigplay .tri{fill:#000;stroke:none}
  .bigplay .ring{stroke-opacity:.35;transform-origin:60px 60px;animation:bpRing 2.4s ease-out infinite}
  .bigplay:hover svg,.bigplay:focus-visible svg{transform:scale(1.07)}
  @keyframes bpRing{0%{transform:scale(.8);stroke-opacity:.5}100%{transform:scale(1.08);stroke-opacity:0}}
  @media (prefers-reduced-motion: reduce){.bigplay .ring{animation:none}}
  @keyframes ppPulse{50%{transform:scale(1.12);color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}}
  #scrub{position:fixed;top:auto;left:3rem;right:3rem;bottom:5.2rem;width:calc(100% - 6rem);height:4rem;z-index:3;cursor:pointer;touch-action:none;background:transparent}
  body.hide-ui #scrub{opacity:.5}
  @media(max-width:700px){#scrub{left:16px;right:16px;width:calc(100% - 32px);bottom:9.5rem;height:48px}}
  /* on short screens the intro's tabs reach down to the play button, so it waits for the intro there */
  @media(max-height:760px){body.sc-ready:not(.intro-done) .bigplay{opacity:0;pointer-events:none}body:not(.intro-done) .skip{visibility:hidden}}
  .drop{position:fixed;inset:1.5rem;border:1px dashed var(--mid);display:flex;align-items:center;justify-content:center;
    font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--hi);opacity:0;pointer-events:none;transition:opacity .3s}
  body.dragging .drop{opacity:1}
  /* SoundCloud's player does the playing; it stays out of sight and the visualiser is the interface */
  #sc{position:fixed;left:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
  /* TV mode (?tv=1): just the visualiser, for a TV or a cast screen */
  body.tv .ui header.top,body.tv footer.bottom,body.tv .transport,body.tv .skip,body.tv #scrub,body.tv .intro,body.tv .peek{display:none!important}
  body.tv.is-playing{cursor:none}
  /* an agent who pops up now and then to have a word */
  .peek{position:fixed;bottom:calc(5.2rem + 4rem + .5rem);left:50%;translate:-50% 0;z-index:6;display:flex;flex-direction:column;align-items:center;pointer-events:none;
    opacity:0;transform:translateY(34px) scale(.5);transition:opacity .25s,transform .4s cubic-bezier(.3,1.6,.5,1)}
  .peek.on{opacity:1;transform:none}
  .peek .bub{font-size:.72rem;letter-spacing:.04em;color:#fff;background:#000;border:1px solid #fff;border-radius:6px;padding:.32rem .6rem;white-space:nowrap;margin-bottom:7px;position:relative}
  .peek .bub::after{content:'';position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:#000;border-right:1px solid #fff;border-bottom:1px solid #fff;transform:translateX(-50%) rotate(45deg)}
  .peek svg{width:26px;height:44px;overflow:visible}
  .peek .arm{transform-origin:13px 15px;animation:peekWave .45s ease-in-out infinite alternate}
  @keyframes peekWave{to{transform:rotate(-45deg)}}
  .peek .nm{font-size:.55rem;letter-spacing:.18em;color:#9a9a9a;margin-top:3px}
  body.shell-on .peek{bottom:4.8rem}
  /* the agent who brings a chair to the breakdown */
  .chairman{position:fixed;bottom:calc(5.2rem + 4rem + .5rem);z-index:6;width:96px;height:120px;pointer-events:none;opacity:0;transition:opacity .4s}
  .chairman.on{opacity:1}
  .chairman svg{position:absolute;left:0;bottom:0;width:96px;height:96px;overflow:visible}
  .chairman .bub{position:absolute;bottom:100px;left:50%;translate:-50% 0;font-size:.72rem;letter-spacing:.04em;color:#fff;background:#000;border:1px solid #fff;border-radius:6px;padding:.32rem .6rem;white-space:nowrap;opacity:0;transition:opacity .25s}
  .chairman .bub.on{opacity:1}
  .chairman.loo{width:96px}
  .chairman .nm{position:absolute;left:50%;bottom:-13px;translate:-50% 0;font-size:.55rem;letter-spacing:.18em;color:#9a9a9a;white-space:nowrap}
  .stickbtn{position:fixed;left:1rem;bottom:.9rem;z-index:6;background:none;border:0;padding:.3rem;cursor:pointer;opacity:.4;transition:opacity .2s,transform .2s}
  .stickbtn svg{width:14px;height:24px;display:block}
  .stickbtn:hover,.stickbtn:focus-visible{opacity:1;transform:translateY(-2px)}
  body.tv .stickbtn,body.shell-on .stickbtn{display:none}
  @media(max-width:700px){.stickbtn{left:.5rem;bottom:calc(.5rem + env(safe-area-inset-bottom,0px))}}
  .chairman .fx{filter:drop-shadow(0 0 2px #a55bff) drop-shadow(0 0 5px #8f4bff)}
  body.shell-on .chairman{bottom:4.8rem}
  body.tv .chairman{display:none!important}
  @media(max-width:700px){.chairman{bottom:calc(9.5rem + 48px + .5rem)}}
  @media(max-width:700px){.peek{bottom:calc(9.5rem + 48px + .5rem)}}
  /* ─── shell: while music plays, other pages open over the homepage and the player shrinks to a bar ─── */
  .shell-frame{position:fixed;left:0;top:0;width:100%;height:calc(100% - 4.4rem);border:0;z-index:20;background:#000;display:none}
  body.shell-on .shell-frame{display:block}
  body.shell-on::after{content:'';position:fixed;left:0;right:0;bottom:0;height:4.4rem;background:#000;border-top:1px solid #2a2a2a;z-index:19}
  body.shell-on .ui{z-index:21}
  body.shell-on .ui header.top,body.shell-on .intro{display:none!important}
  body.shell-on footer.bottom{pointer-events:none}
  body.shell-on footer.bottom .right,body.shell-on footer.bottom .right *{pointer-events:auto}
  body.shell-on .bigplay,body.shell-on footer.bottom .controls,body.shell-on footer.bottom #status,body.shell-on footer.bottom #cue{display:none!important}
  body.shell-on .transport{bottom:.6rem;left:1rem;z-index:21}
  body.shell-on .skip{bottom:.6rem;right:1rem;z-index:21}
  body.shell-on #scrub{bottom:.45rem;left:5.6rem;right:9rem;width:calc(100% - 14.6rem);height:2.6rem;z-index:21}
  body.shell-on footer.bottom .right{position:fixed;left:5.6rem;bottom:3.15rem;z-index:22;text-align:left}
  body.shell-on .now{font-size:.62rem;-webkit-line-clamp:1;max-width:60vw}
  @media(max-width:700px){body.shell-on #scrub{left:4.4rem;right:7.4rem;width:calc(100% - 11.8rem)}body.shell-on footer.bottom .right{left:4.4rem}}

  input[type=file]{display:none}
  .po{position:fixed;inset:0;z-index:10000;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
  .po.active{display:flex}
  .pc{position:absolute;top:1.5rem;right:2rem;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:#aaa;background:none;border:none;cursor:pointer;padding:.5rem;font-family:inherit}
  .pc:hover{color:#fff}
  .ps{font-size:.7rem;letter-spacing:.15em;color:#ffcc00;margin-bottom:1rem}
  .ph{font-size:.7rem;letter-spacing:.1em;color:#999;margin-top:1rem}
  #pacCanvas{position:static;width:auto;height:auto;max-width:100%}
  .pp{width:3.6rem;height:3.6rem;padding:0;color:#fff;opacity:.85;transition:opacity .3s,transform .3s}
  /* Full screen and Egg: tucked away, faint until you look for them */
  .hush{position:fixed;right:3rem;bottom:calc(5.2rem + 4rem + .9rem + 3.6rem + .5rem);z-index:4;display:flex;gap:1.4rem;justify-content:flex-end;pointer-events:auto}
  @media(max-width:700px){.hush{right:16px;bottom:calc(9.5rem + 48px + .7rem + 40px + .4rem)}}
  body.tv .hush{display:none}
  .hush button{color:#fff;background:none;border:0;padding:.3rem 0;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;opacity:.28;transition:opacity .2s}
  .hush button:hover,.hush button:focus-visible{opacity:.9}
  body.shell-on .hush{display:none}
  footer.bottom .controls[hidden]{display:none!important}
  .pp:hover{opacity:1;transform:scale(1.06)}
  .pp svg{width:100%;height:100%;display:block}
  .pp .ic-pause{display:none} .pp.playing .ic-pause{display:inline} .pp.playing .ic-play{display:none}
  .controls{align-items:center}
  /* transport: play/pause on the left and previous/next on the right, both sitting just above the seek waveform */
  .transport,.skip{position:fixed;bottom:calc(5.2rem + 4rem + .9rem);z-index:4;display:flex;gap:.9rem;align-items:center;pointer-events:auto}
  .transport{left:3rem} .skip{right:3rem}
  .bigplay{display:none!important}            /* the outline play button on the left does the job from the start */
  footer.bottom .right{margin-left:auto}
  .pp.sk{width:2.75rem;height:2.75rem}
  .pp:disabled{opacity:.3}
  @media(max-width:700px){.transport,.skip{bottom:calc(9.5rem + 48px + .7rem)}.transport{left:16px}.skip{right:16px}.pp.sk{width:40px;height:40px}}
  /* the intro: the name fades in, the tabs follow, then both drift away and leave the visuals */
  .intro{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:16px}
  .intro .name{font-family:'Syne',sans-serif;font-weight:500;font-size:clamp(2.6rem,9vw,7.5rem);line-height:1;letter-spacing:-.03em;text-transform:uppercase;color:#fff;
    opacity:0;animation:nameIn 2.4s .4s forwards;text-shadow:0 0 40px #000}
  .intro .name .ch{display:inline-block;will-change:transform}
  .intro .name i{font-style:normal;font-weight:400;opacity:.55}
  .intro nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin-top:2.4rem;max-width:760px}
  .intro nav a{pointer-events:auto;border:1px solid rgba(255,255,255,.35);color:#fff;padding:.75rem 1.1rem;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;
    background:rgba(0,0,0,.55);opacity:0;animation:fi 1.2s forwards;transition:border-color .3s,background .3s;will-change:transform}
  .intro nav a:hover{border-color:#fff;background:rgba(255,255,255,.08)}
  body.intro-done .intro nav{visibility:hidden}
  @keyframes nameIn{0%{opacity:0;filter:blur(10px)}100%{opacity:1;filter:blur(0)}}
  @keyframes fadeAway{to{opacity:0;filter:blur(4px)}}
  @media(max-width:700px){.pp{width:50px;height:50px}}
  @media (prefers-reduced-motion: reduce){.intro .name,.intro nav a{animation-duration:.01s!important}}
  .tag{display:block;font-size:.7rem;letter-spacing:.4em;color:var(--mid);margin-top:.5rem}
  nav.site{display:flex;gap:.6rem 2rem;flex-wrap:wrap;justify-content:center}
  nav.site a{opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
  nav.site{align-items:center} nav.site .has-sub{position:relative;display:inline-flex}
  nav.site .sub{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.55rem;
    padding:.9rem 1.2rem;background:rgba(0,0,0,.85);border:1px solid #333;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:6;white-space:nowrap}
  nav.site .has-sub:hover .sub,nav.site .has-sub:focus-within .sub{opacity:1;visibility:visible}
  nav.site .sub a{opacity:1!important;visibility:inherit;font-size:.74rem}
  nav.site a.landed,body.intro-done nav.site a{opacity:1;visibility:visible}
  nav.site a{color:#e0e0e0;font-size:.86rem;letter-spacing:.26em;padding:.3rem 0}
  @media(max-width:700px){nav.site{gap:.15rem 1.1rem}nav.site a{font-size:.74rem;letter-spacing:.2em}}
  nav.site a:hover{color:#fff}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;min-width:0}
  @media(max-width:700px){nav.site{gap:.9rem}.top{gap:.9rem}.right{align-items:center}}
  @keyframes fi{to{opacity:1}}
  @media(max-width:700px){
    .top,.bottom{padding:1.25rem 1rem;font-size:.7rem;letter-spacing:.2em}
    .now{font-size:.7rem;max-width:92vw;text-align:center}
    .bottom{flex-direction:column;align-items:center;gap:1rem}
    .controls{gap:.4rem 1rem;justify-content:center;letter-spacing:.12em}
    .status{text-align:center;max-width:100%}
  }
  /* nothing may make the page wider than the screen (Chrome on Android lays the page out wider and shifts it) */
  html,body{max-width:100%;overflow-x:clip}
  @media(max-width:700px),(hover:none){nav.site .sub{display:none}}
  .chairman:not(.on){visibility:hidden}
  /* phones: tuck the player down so the visualiser gets the screen. The track name and status sit tight
     at the bottom, the waveform scrubber just above them, the transport just above that. */
  @media(max-width:700px){
    :root{--sb:env(safe-area-inset-bottom,0px);--scrubB:calc(4.1rem + var(--sb));--scrubH:38px}
    .bottom{padding:.5rem 1rem calc(.7rem + var(--sb));gap:.2rem}
    .now{font-size:.66rem}
    .status{font-size:.62rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92vw}
    #scrub{bottom:var(--scrubB);height:var(--scrubH)}
    .transport,.skip{bottom:calc(var(--scrubB) + var(--scrubH) + .35rem)}
    .pp{width:42px;height:42px}
    .pp.sk{width:34px;height:34px}
    .hush{bottom:calc(var(--scrubB) + var(--scrubH) + .35rem + 42px + .2rem)}
    .peek,.chairman{bottom:calc(var(--scrubB) + var(--scrubH) + .5rem)}
  }
</style>

// Choose at random from a list, avoiding what this browser played recently.

const trackWeight = (p, n) => 1 + 0.4 * (1 - (p.rank || 0) / Math.max(1, n - 1));

}

// The SoundCloud player loads the whole profile; wait until its track list stops growing, then read it.

/* ─── Choreography: Agent Masterpiece's cue sheet for this track ── */
const PALETTE = { red: '#ff3b3b', amber: '#ffb000', cyan: '#22d3ee', violet: '#a78bfa', green: '#4ade80' };
// RGB laser colours: the full hue wheel in 36 steps, as hex so the beam haze can fade them
const HUES = Array.from({ length: 36 }, (_, i) => { const h = i / 36, f = n => { const k = (n + h * 12) % 12, c = 0.5 - 0.5 * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(255 * Math.min(1, c * 1.15 + 0.08)).toString(16).padStart(2, '0'); }; return '#' + f(0) + f(8) + f(4); });

const mixHex = (a, b, t) => '#' + [0, 2, 4].map(i => Math.round(parseInt(a.substr(i + 1, 2), 16) * (1 - t) + parseInt(b.substr(i + 1, 2), 16) * t).toString(16).padStart(2, '0')).join('');
const UV_LO = Array.from({ length: 11 }, (_, n) => mixHex('#ffffff', '#8f4bff', n / 10));
const UV_HI = Array.from({ length: 11 }, (_, n) => mixHex('#ffffff', '#c58cff', n / 10));
let uv = null, uvK = 0, lastUv = -30;
function startUv() { if (uv) return; lastUv = clockT; uv = { t0: clockT, life: 4 + Math.random() * 2.5 }; if (Math.random() < 0.5) setTimeout(uvPaint, 300); }   // sometimes an agent gets the face paint out

    else {
      look = ['colour-line', 'scanner', 'colour-wash', 'mirror', 'spikes'][Math.floor(Math.random() * 5)];
      lookColour = Object.values(PALETTE)[Math.floor(Math.random() * 5)];
      freeLookUntil = clockT + 6 + Math.random() * 6;
    }

}

function readSound() {
  sc.getCurrentSound(s => {
    if (!s || s.id === scSoundId) return;

    scDuration = s.duration || s.full_duration || 0;

}

// SoundCloud publishes each track's loudness over time; it drives the lines in sync with playback.
async function loadWave(url) {
  wave = null;
  if (!url) return;
  try {
    let j = null;
    try { const r = await fetch('/api/waveform?wave=' + encodeURIComponent(url.split('?')[0])); if (r.ok) j = await r.json(); } catch (e) {}
    if (!j || !j.samples) j = await (await fetch(url.replace(/\.png(\?.*)?$/, '.json'))).json();
    const h = j.height || 140;
    wave = j.samples.map(v => v / h);
    const sorted = [...wave].sort((a, b) => a - b);
    waveLo = sorted[Math.floor(sorted.length * 0.05)];
    waveHi = sorted[Math.floor(sorted.length * 0.98)] || 1;

}

// Live energy of the music, shared with the camera: level 0..1, hit = sudden jumps in loudness.
let energy = 0, hit = 0, rowCount = 0;

function sampleSoundCloud(row) {
  // Lines are born at the far edge and travel towards you, so sample ahead by the time a line takes
  // to reach the front part of the surface: the peaks arrive there exactly as you hear them.
  const lead = scPlaying ? 1000 * (SHOW * 0.6) / (ROW_RATE * Math.max(0.5, view.speed)) : 0;
  const pos = scPos + (scPlaying ? performance.now() - scPosAt : 0) + lead;
  const t = pos / 1000;
  let level, kick, raw = 1;
  if (wave && scDuration) {
    const n = wave.length, fi = Math.max(0, Math.min(n - 1.001, (pos / scDuration) * n));
    const i0 = Math.floor(fi), fr = fi - i0;
    const norm = v => Math.max(0, Math.min(1, (v - waveLo) / (waveHi - waveLo || 1)));
    level = norm(wave[i0]) * (1 - fr) + norm(wave[i0 + 1]) * fr;      // smooth between waveform points
    raw = level;
    // local contrast: compare with the surrounding ±20 s, so every swell and dip shows even in a loud mix
    const win = Math.max(3, Math.round((20000 / scDuration) * n));
    let lmin = 1, lmax = 0;
    for (let k = -win; k <= win; k += Math.max(1, win >> 3)) { const v = norm(wave[Math.max(0, Math.min(n - 1, i0 + k))]); if (v < lmin) lmin = v; if (v > lmax) lmax = v; }
    const local = lmax - lmin > 0.05 ? (level - lmin) / (lmax - lmin) : 0.5;
    level = Math.min(1, 0.35 * level + 0.65 * local);
    const span = Math.max(2, Math.round((2000 / scDuration) * n));     // the last ~2 seconds
    let avg = 0;
    for (let k = 1; k <= span; k++) avg += norm(wave[Math.max(0, i0 - k)]);
    kick = Math.max(0, level - avg / span) * 5;
  } else {
    const beat = (pos / 500) % 1;            // ~120 bpm pulse if the waveform isn't available
    level = 0.4 + 0.35 * Math.exp(-beat * 6);
    kick = Math.exp(-beat * 8) * 0.5;
  }
  // silence is flat: no sound, no lines moving (fades in over the quietest few per cent)
  const gate = Math.max(0, Math.min(1, (raw - 0.03) / 0.09));
  if (gate <= 0) { row.fill(0); return; }
  shapeRow(row, t, level, kick);
  if (gate < 1) for (let i = 0; i < POINTS; i++) row[i] *= gate;
}

// Peaks drift smoothly over time; loudness lifts them, hits throw up sharp spikes.
function shapeRow(row, t, level, kick) {
  row.fill(0);
  const r = seeded(++rowCount * 2654435761);
  for (let k = 0; k < 6; k++) {
    const c = 0.5 + 0.3 * Math.sin(t * (0.31 + 0.13 * k) + k * 1.7) + 0.05 * Math.sin(t * (1.9 + k * 0.4));
    const w = 0.006 + 0.016 * (0.5 + 0.5 * Math.sin(t * 0.7 + k * 2.1));
    const a = (0.08 + level * 1.5) * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * (1.1 + 0.37 * k) + k * 2.3)));
    for (let i = 0; i < POINTS; i++) { const x = i / (POINTS - 1) - c; row[i] += a * Math.exp(-(x * x) / (2 * w * w)); }
  }
  if (kick > 0.08) {
    for (let k = 0; k < 3; k++) {
      const c = 0.5 + (r() - 0.5) * 0.6, w = 0.004 + r() * 0.006, a = kick * (1.2 + r() * 1.2);
      for (let i = 0; i < POINTS; i++) { const x = i / (POINTS - 1) - c; row[i] += a * Math.exp(-(x * x) / (2 * w * w)); }
    }
  }
  // jagged: fine random jitter and the odd sharp spike, like a pulsar plot
  for (let i = 0; i < POINTS; i++) {
    let j = r() * 0.1 * (0.3 + level);
    if (r() < 0.04) j += r() * 0.35 * level;
    row[i] = Math.min(row[i] + j, 1.7);
  }
}

/* ─── Source 2 & 3: local file / microphone (real frequency analysis) ── */
let actx = null, analyser = null, freq = null, binMap = null, timeBuf = null, specBuf = null;
let audioEl = null, micStream = null, micSource = null;
let lastMedia = 'sc';

function ensureAudio() {
  if (actx) return;

  analyser = actx.createAnalyser();
  analyser.fftSize = FFT;

/* ─── Music analysis: kick, tempo, breaks and drops ───────── */

function analyse(dt) {

Each(([ox,oy])=>{ppx.fillStyle='#fff';ppx.beginPath();ppx.arc(gx+ox,gy+oy,3,0,Math.PI*2);ppx.fill();ppx.fillStyle='#00f';ppx.beginPath();ppx.arc(gx+ox+ds[g.d].x,gy+oy+ds[g.d].y,1.5,0,Math.PI*2);ppx.fill()})}else{ppx.fillStyle='#fff';[[-3,-3],[3,-3]].forEach(([ox,oy])=>{ppx.beginPath();ppx.arc(gx+ox,gy+oy,2,0,Math.PI*2);ppx.fill()})}});if(go){ppx.fillStyle='rgba(0,0,0,.8)';ppx.fillRect(0,0,pcc.width,pcc.height);ppx.fillStyle='#cc0000';ppx.font='500 22px "Syne"';ppx.textAlign='center';ppx.fillText('Game Over',pcc.width/2,pcc.height/2);ppx.fillStyle='#333';ppx.font='300 10px "IBM Plex Mono"';ppx.fillText('Click to restart',pcc.width/2,pcc.height/2+22)}if(gw){ppx.fillStyle='rgba(0,0,0,.8)';ppx.fillRect(0,0,pcc.width,pcc.height);ppx.fillStyle='#c90';ppx.font='500 22px "Syne"';ppx.textAlign='center';ppx.fillText('You Win',pcc.width/2,pcc.height/2)}se.textContent='Score: '+sc}function gl2(){if(!ov.classList.contains('active'))return;if(!go&&!gw)upd();drw();pg=requestAnimationFrame(gl2)}pcc.onclick=()=>{if(go||gw)startPac()};gl2()}
</script>
