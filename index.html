<style>
  html{font-size:16px}
  @media(min-width:1800px){html{font-size:18px}}
  @media(min-width:2400px){html{font-size:22px}}
  @media(min-width:3200px){html{font-size:28px}}
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#000;
    --ink:#fff;
    --dim:#8a8070;
    --mid:#a09680;
    --hi:#f0e6cc;
  }
  html,body{height:100%}
  body{background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;
    font-family:'IBM Plex Mono',monospace;color:var(--mid)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;transition:opacity .8s}
  .ui *{pointer-events:auto}
  body.hide-ui .ui{opacity:0}
  body.hide-ui .ui *{pointer-events:none}
  .top,.bottom{padding:2.5rem 3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;
    font-size:.7rem;font-weight:300;letter-spacing:.3em;text-transform:uppercase}
  .top{opacity:0;animation:fi 2s .5s forwards;flex-direction:column;justify-content:flex-start;gap:1.1rem}
  .nameslot{font-family:'Syne',sans-serif;font-weight:500;font-size:clamp(1.3rem,3.2vw,2.3rem);letter-spacing:.14em;color:#fff;line-height:1;white-space:nowrap;visibility:hidden}
  .nameslot .sl{display:inline-block} .nameslot .dim{opacity:.55} .nameslot .gap{display:inline-block;width:.45em}
  body.name-landed .nameslot{visibility:visible}
  .bottom{align-items:flex-end;opacity:0;animation:fi 2s 1.2s forwards}
  a,button{color:var(--dim);text-decoration:none;background:none;border:none;font:inherit;
    letter-spacing:inherit;text-transform:inherit;cursor:pointer;transition:color .6s}
  a:hover,button:hover,button:focus-visible,a:focus-visible{color:var(--hi);outline:none}
  button[aria-pressed="true"]{color:var(--hi)}
  button:disabled{opacity:.4;cursor:default}
  .now{font-family:'Syne',sans-serif;font-weight:500;font-size:.75rem;letter-spacing:.2em;color:var(--mid);line-height:1.45;
    max-width:min(62ch,48vw);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:right}
  .now:empty{display:none}
  .controls{display:flex;gap:1.8rem;flex-wrap:wrap}
  .controls button{padding:.7rem 0;min-height:32px}
  .status{max-width:min(62ch,48vw);text-align:right;color:var(--mid);line-height:1.5;letter-spacing:.2em}
  /* if the browser blocks autoplay, the wireframe play button pulses instead of a big button in the middle */
  body.needs-tap #playBtn{animation:ppPulse 1.6s ease-in-out infinite;opacity:1}
  /* the big wireframe play in the middle: shown whenever nothing is playing, gone once the music starts */
  .bigplay{position:fixed;left:50%;top:auto;bottom:calc(5.2rem + 4rem + .6rem);transform:translate(-50%,0) scale(.92);z-index:5;display:flex;flex-direction:column;align-items:center;gap:.9rem;
    background:none;border:0;color:#fff;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s}
  body.intro-done:not(.is-playing) .bigplay,body.sc-ready:not(.is-playing) .bigplay{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
  @media(max-width:700px){.bigplay{bottom:calc(9.5rem + 48px + .4rem)}}
  body.hide-ui .bigplay{opacity:0!important;pointer-events:none!important}
  .bigplay svg{width:clamp(64px,6vw,6rem);height:auto;fill:none;stroke:#fff;stroke-width:1.2;stroke-linejoin:round;transition:transform .4s}
  /* fully inverted: the disc flips whatever is behind it, and the play triangle is cut out of it */
  .bigplay svg{mix-blend-mode:difference}
  .bigplay .disc{fill:#fff;stroke:none}
  .bigplay .tri{fill:#000;stroke:none}
  .bigplay .ring{stroke-opacity:.35;transform-origin:60px 60px;animation:bpRing 2.4s ease-out infinite}
  .bigplay:hover svg,.bigplay:focus-visible svg{transform:scale(1.07)}
  @keyframes bpRing{0%{transform:scale(.8);stroke-opacity:.5}100%{transform:scale(1.08);stroke-opacity:0}}
  @media (prefers-reduced-motion: reduce){.bigplay .ring{animation:none}}
  @keyframes ppPulse{50%{transform:scale(1.12);color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}}
  #scrub{position:fixed;top:auto;left:3rem;right:3rem;bottom:5.2rem;width:calc(100% - 6rem);height:4rem;z-index:3;cursor:pointer;touch-action:none;background:transparent}
  body.hide-ui #scrub{opacity:.5}
  @media(max-width:700px){#scrub{left:16px;right:16px;width:calc(100% - 32px);bottom:9.5rem;height:48px}}
  .hint{position:fixed;left:50%;bottom:10rem;transform:translateX(-50%);font-size:.7rem;letter-spacing:.35em;
    text-transform:uppercase;color:var(--mid);white-space:nowrap;opacity:0;pointer-events:none;animation:hint 7s 2s forwards}
  @keyframes hint{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
  body.hide-ui .hint{display:none}
  /* the hint sits where the waveform will be (empty until something plays), clear of the big play button */
  .hint{bottom:6.2rem}
  @media(max-width:700px){.hint{bottom:auto;top:7.5rem;white-space:normal;width:calc(100% - 32px);text-align:center;line-height:1.8}}
  /* on short screens the intro's tabs reach down to the play button, so it waits for the intro there */
  @media(max-height:760px){body.sc-ready:not(.intro-done) .bigplay{opacity:0;pointer-events:none}body:not(.intro-done) .skip{visibility:hidden}}
  .drop{position:fixed;inset:1.5rem;border:1px dashed var(--mid);display:flex;align-items:center;justify-content:center;
    font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--hi);opacity:0;pointer-events:none;transition:opacity .3s}
  body.dragging .drop{opacity:1}
  /* SoundCloud's player does the playing; it stays out of sight and the visualiser is the interface */
  #sc{position:fixed;left:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
  input[type=file]{display:none}
  .po{position:fixed;inset:0;z-index:10000;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
  .po.active{display:flex}
  .pc{position:absolute;top:1.5rem;right:2rem;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:#aaa;background:none;border:none;cursor:pointer;padding:.5rem;font-family:inherit}

  .ps{font-size:.7rem;letter-spacing:.15em;color:#ffcc00;margin-bottom:1rem}
  .ph{font-size:.7rem;letter-spacing:.1em;color:#999;margin-top:1rem}

  .pp .ic-pause{display:none} .pp.playing .ic-pause{display:inline} .pp.playing .ic-play{display:none}
  .controls{align-items:center}
  /* transport: play/pause on the left and previous/next on the right, both sitting just above the seek waveform */
  .transport,.skip{position:fixed;bottom:calc(5.2rem + 4rem + .9rem);z-index:4;display:flex;gap:.9rem;align-items:center;pointer-events:auto}
  .transport{left:3rem} .skip{right:3rem}

  .pp:disabled{opacity:.3}
  @media(max-width:700px){.transport,.skip{bottom:calc(9.5rem + 48px + .7rem)}.transport{left:16px}.skip{right:16px}.pp.sk{width:40px;height:40px}}
  /* the intro: the name fades in, the tabs follow, then both drift away and leave the visuals */
  .intro{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:16px}
  .intro .name{font-family:'Syne',sans-serif;font-weight:500;font-size:clamp(2.6rem,9vw,7.5rem);line-height:1;letter-spacing:-.03em;text-transform:uppercase;color:#fff;

  .intro .name .ch{display:inline-block;will-change:transform}
  .intro .name i{font-style:normal;font-weight:400;opacity:.55}
  .intro nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin-top:2.4rem;max-width:760px}
  .intro nav a{pointer-events:auto;border:1px solid rgba(255,255,255,.35);color:#fff;padding:.75rem 1.1rem;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;
    background:rgba(0,0,0,.55);opacity:0;animation:fi 1.2s forwards;transition:border-color .3s,background .3s;will-change:transform}
  .intro nav a:hover{border-color:#fff;background:rgba(255,255,255,.08)}
  body.intro-done .intro nav{visibility:hidden}
  @keyframes nameIn{0%{opacity:0;filter:blur(10px)}100%{opacity:1;filter:blur(0)}}
  @keyframes fadeAway{to{opacity:0;filter:blur(4px)}}
  @media(max-width:700px){.pp{width:50px;height:50px}}
  @media (prefers-reduced-motion: reduce){.intro .name,.intro nav a{animation-duration:.01s!important}}
  .tag{display:block;font-size:.7rem;letter-spacing:.4em;color:var(--mid);margin-top:.5rem}
  nav.site{display:flex;gap:.6rem 2rem;flex-wrap:wrap;justify-content:center}
  nav.site a{opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
  nav.site{align-items:center} nav.site .has-sub{position:relative;display:inline-flex}
  nav.site .sub{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.55rem;
    padding:.9rem 1.2rem;background:rgba(0,0,0,.85);border:1px solid #333;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:6;white-space:nowrap}
  nav.site .has-sub:hover .sub,nav.site .has-sub:focus-within .sub{opacity:1;visibility:visible}
  nav.site .sub a{opacity:1!important;visibility:inherit;font-size:.74rem}
  nav.site a.landed,body.intro-done nav.site a{opacity:1;visibility:visible}
  nav.site a{color:#e0e0e0;font-size:.86rem;letter-spacing:.26em;padding:.3rem 0}
  @media(max-width:700px){nav.site{gap:.15rem 1.1rem}nav.site a{font-size:.74rem;letter-spacing:.2em}}
  nav.site a:hover{color:#fff}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:.6rem;min-width:0}
  @media(max-width:700px){nav.site{gap:.9rem}.top{gap:.9rem}.right{align-items:center}}
  @keyframes fi{to{opacity:1}}
  @media(max-width:700px){
    .top,.bottom{padding:1.25rem 1rem;font-size:.7rem;letter-spacing:.2em}
    .now{font-size:.7rem;max-width:92vw;text-align:center}
    .bottom{flex-direction:column;align-items:center;gap:1rem}
    .controls{gap:.4rem 1rem;justify-content:center;letter-spacing:.12em}
    .status{text-align:center;max-width:100%}
  }
</style>

<script>
(() => {
'use strict';

/* ─── Settings ───────────────────────────────────────────── */
// Where the admin page's chosen song is kept (read-only key; safe to be public).
const SETTINGS_URL = 'https://ynhyylnsbvmdasyyalcg.supabase.co/rest/v1/jn_site_settings?key=eq.now_playing&select=value';
const SETTINGS_KEY = 'sb_publishable_hc4qj9_jLSC388ntEKhaLA_RBlGvA1v';
// If no song has been chosen, play the latest uploads from this profile.
const DEFAULT_SOUNDCLOUD = 'https://soundcloud.com/jamesnormal';
const SC_URL_RE = /^https:\/\/(www\.|m\.)?soundcloud\.com\/[^\s"<>]+$/;

const ROWS = 72;            // number of ridge lines
const POINTS = 160;         // samples per line
const ROW_RATE = 42;        // new lines per second while music plays (each line is ~24 ms of music)
const FFT = 2048;
const MIN_HZ = 30, MAX_HZ = 9000;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ─── Canvas ─────────────────────────────────────────────── */
const cv = document.getElementById('plot');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

/* ─── History: ring buffer of rows ───────────────────────── */
const TOTAL = ROWS * 2;      // lines ahead of the ship and behind it (seen during loops)
const history = Array.from({ length: TOTAL }, () => new Float32Array(POINTS));
let head = 0, rowClock = 0;

const envelope = new Float32Array(POINTS);
for (let i = 0; i < POINTS; i++) {
  const d = (i / (POINTS - 1) - 0.5) * 2;
  envelope[i] = 0.12 + 0.88 * Math.exp(-(d * d) / (2 * 0.34 * 0.34));
}

/* Seeded random, so a given moment of a song always draws the same shape. */
function seeded(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let idleSeed = 1;

function bumps(row, rnd, level, kick) {
  row.fill(0);
  const n = 3 + ((rnd() * 4) | 0);
  for (let k = 0; k < n; k++) {
    const c = 0.5 + (rnd() - 0.5) * 0.34;
    const w = 0.008 + rnd() * 0.03;
    const a = (0.2 + rnd() * 0.8) * level + kick * rnd();
    for (let i = 0; i < POINTS; i++) {
      const x = i / (POINTS - 1) - c;
      row[i] += a * Math.exp(-(x * x) / (2 * w * w));
    }
  }
  for (let i = 0; i < POINTS; i++) row[i] = Math.min(row[i] + rnd() * 0.05 * (0.4 + level), 1.4);
}

/* ─── Source 1: SoundCloud ───────────────────────────────── */
let sc = null, scPlaying = false, scPos = 0, scPosAt = 0, scDuration = 0;
let scSoundId = null, wave = null, waveLo = 0, waveHi = 1, scReady = false;

// Each visit plays one of the tracks the agents picked recently (the DJ's
// hourly pick and both battle picks), chosen at random, and credits the agent who picked it.
let pickedBy = null, picks = [], queue = [], qi = -1;
function remember(url) {
  try { const r = JSON.parse(localStorage.getItem('jn-recent') || '[]').filter(u => u !== url); r.unshift(url); localStorage.setItem('jn-recent', JSON.stringify(r.slice(0, 20))); } catch (e) { /* private mode */ }
}   // the agents' picks, and the order played so far
async function chosenTrack() {
  const q = new URLSearchParams(location.search).get('track');   // ?track=<SoundCloud link> plays that track
  if (q && SC_URL_RE.test(q)) return { url: q, fixed: true };
  try {                                                         // a song set on the admin page wins
    const [row] = await (await fetch(SETTINGS_URL, { headers: { apikey: SETTINGS_KEY }, cache: 'no-store' })).json();
    const url = row && row.value && row.value.url;
    if (url && SC_URL_RE.test(url)) return { url, fixed: true };
  } catch (e) { /* no override */ }
  // Every track James has on SoundCloud, plus the agents' recent picks; choose at random, avoiding the
  // last few this browser has played, and credit the agent who picked it (or a random member of the crew).
  const CREW = ['Agent Disco Biscuit', 'Agent Monkey Monkey', 'Fish Fish', 'Agent Pickle', 'Agent Kipper', 'Agent Goatman', 'Agent Codpiece', 'Agent Fish', 'Agent God', 'Agent Trouserpress'];
  const [catalogue, rows] = await Promise.all([
    fetch('/api/tracks').then(r => r.json()).then(d => d.tracks || []).catch(() => []),
    fetch(SETTINGS_URL.replace(/jn_site_settings.*$/, 'jn_night_shift?select=dj:log->dj,battle:log->battle&order=id.desc&limit=24'),
      { headers: { apikey: SETTINGS_KEY }, cache: 'no-store' }).then(r => r.json()).catch(() => [])
  ]);
  const pool = new Map();
  for (const t of catalogue) if (SC_URL_RE.test(t.url)) pool.set(t.url, { ...t, by: CREW[Math.floor(Math.random() * CREW.length)] });
  for (const row of Array.isArray(rows) ? rows : []) {
    if (row.dj && row.dj.track) pool.set(row.dj.track.url, { ...row.dj.track, by: 'Agent Disco Biscuit' });
    for (const k of ['a', 'b']) { const p = row.battle && row.battle[k]; if (p && p.track) pool.set(p.track.url, { ...p.track, by: { VANTAGE: 'Agent Monkey Monkey', LOWLIGHT: 'Fish Fish' }[p.agent] || p.agent.replace(/\b\w/g, c => c.toUpperCase()).replace(/\B\w+/g, w => w.toLowerCase()) }); }
  }
  return { url: DEFAULT_SOUNDCLOUD, fixed: false, pool: [...pool.values()].filter(p => SC_URL_RE.test(p.url)), crew: CREW };
}

// Choose at random from a list, avoiding what this browser played recently.
function pickFrom(list) {
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem('jn-recent') || '[]'); } catch (e) { /* private mode */ }
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }   // shuffle
  const fresh = a.filter(p => !recent.includes(p.key));
  return (fresh.length ? fresh : a)[0];
}

// The SoundCloud player loads the whole profile; wait until its track list stops growing, then read it.
function readProfile() {
  return new Promise(resolve => {
    let last = -1, tries = 0;
    const look = () => sc.getSounds(sounds => {
      const n = (sounds || []).length;
      if ((n === last && n > 0) || tries++ > 8) return resolve(sounds || []);
      last = n; setTimeout(look, 450);
    });
    look();
  });
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

let listing = false, choice = null;
async function startSoundCloud() {
  const api = loadScript('https://w.soundcloud.com/player/api.js');   // in parallel with choosing the track
  api.catch(() => {});
  choice = await chosenTrack();
  const url = choice.url;
  listing = !choice.fixed;
  try { await api; }
  catch (e) { setStatus('SoundCloud unavailable'); return; }

  const iframe = document.createElement('iframe');
  iframe.id = 'sc';
  iframe.title = 'SoundCloud player';
  iframe.allow = 'autoplay; encrypted-media';
  iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
    `&auto_play=false&hide_related=true&show_comments=false&show_reposts=false&visual=false`;
  document.body.appendChild(iframe);

  const E = SC.Widget.Events;
  sc = SC.Widget(iframe);
  sc.bind(E.READY, async () => {
    if (listing) {                         // first load: the whole profile, to get every track
      listing = false;
      const sounds = await readProfile();
      const byUrl = new Map((choice.pool || []).map(p => [p.url, p]));
      const list = sounds.map((t, index) => {
        const url = (t.permalink_url || '').split('?')[0], known = byUrl.get(url);
        return { index, url, key: url || 'id:' + t.id, title: t.title || (known && known.title) || '', by: known ? known.by : choice.crew[Math.floor(Math.random() * choice.crew.length)] };
      });
      if (list.length > 1) {
        picks = list; profileMode = true;
        const pick = pickFrom(list); queue = [pick]; qi = 0;
        scReady = true; enableButtons();
        cue(pick);
        return;
      }
      // the profile list didn't come through: fall back to the RSS tracks and the agents' picks
      const pool = (choice.pool || []).map(p => ({ ...p, key: p.url }));
      if (pool.length) { picks = pool; const pick = pickFrom(pool); queue = [pick]; qi = 0; scReady = true; enableButtons(); cue(pick); return; }
    }
    scReady = true;
    enableButtons();
    readSound();
    if (!scPlaying) setStatus('Ready: press play');       // nothing plays until the visitor asks
  });
  sc.bind(E.PLAY, () => {
    if (!window._homePlayed && window.JN) { window._homePlayed = 1; JN.event('home-play'); }
    scPlaying = true;
    document.body.classList.remove('needs-tap');
    if (audioEl && !audioEl.paused) audioEl.pause();
    stopMic();
    lastMedia = 'sc';
    readSound();
    setStatus(pickedBy ? `Picked by ${pickedBy}` : 'Playing from SoundCloud');
    setPlayIcon(true);
  });
  sc.bind(E.PAUSE, () => { scPlaying = false; if (lastMedia === 'sc') { setPlayIcon(false); setStatus('Paused'); } });
  sc.bind(E.FINISH, () => { scPlaying = false; if (queue.length) skip(1); });   // carry on with another agent pick
  sc.bind(E.PLAY_PROGRESS, e => { scPos = e.currentPosition; scPosAt = performance.now(); });
  sc.bind(E.ERROR, () => setStatus('Couldn’t load that SoundCloud track'));
}

/* ─── Choreography: Agent Pickle's cue sheet for this track ── */
const PALETTE = { red: '#ff3b3b', amber: '#ffb000', cyan: '#22d3ee', violet: '#a78bfa', green: '#4ade80' };
let score = null, cueIdx = -1, look = 'plain', lookColour = null, freeLookUntil = 0;
async function loadScore(url) {
  score = null; cueIdx = -1;
  try {
    const rows = await (await fetch(SETTINGS_URL.replace(/jn_site_settings.*$/, 'jn_scores?select=score&track_url=eq.' + encodeURIComponent(url)),
      { headers: { apikey: SETTINGS_KEY } })).json();
    if (rows[0] && rows[0].score && Array.isArray(rows[0].score.cues)) score = rows[0].score;
  } catch (e) { score = null; }
  $('cue').textContent = score ? `Choreography by ${score.by || 'Agent Pickle'} · ${score.mood || ''}` : '';
}
let lastScoreT = -1, nextGoat = 90 + Math.random() * 120;
function followScore() {
  if (source === 'sc' && score) {
    const t = (scPos + (scPlaying ? performance.now() - scPosAt : 0)) / 1000;
    // moments: fire the ones we have just passed (not the ones skipped over by seeking)
    if (Array.isArray(score.moments) && t > lastScoreT && t - lastScoreT < 1.5)
      for (const m of score.moments) if (m.at > lastScoreT && m.at <= t) fireMoment(m);
    lastScoreT = t;
    let i = score.cues.findIndex(c => t >= c.at && t < c.until);
    if (i !== cueIdx) {
      cueIdx = i;
      const c = score.cues[i];
      if (c) {
        look = c.look; lookColour = c.colour !== 'none' ? PALETTE[c.colour] : null;
        if (autoNow) {
          shape.curlTo = c.curl; shape.twistTo = c.twist;
          if (c.shot === 'close') { setMode('orbit'); view.dist = 1.8; } else if (view.mode !== c.shot) setMode(c.shot);
        }
        $('cue').textContent = `${score.by || 'Agent Pickle'}: “${c.note}”`;
      }
    }
    return;
  }
  // no cue sheet yet: every so often, a colour or scanner moment, and now and then a goat
  if (source !== 'idle' && clockT > nextGoat) { nextGoat = clockT + 150 + Math.random() * 200; fireMoment({ type: 'goat' }); }
  if (clockT > freeLookUntil) {
    if (look !== 'plain') { look = 'plain'; lookColour = null; freeLookUntil = clockT + 25 + Math.random() * 35; }
    else {
      look = ['colour-line', 'scanner', 'colour-wash', 'mirror', 'spikes'][Math.floor(Math.random() * 5)];
      lookColour = Object.values(PALETTE)[Math.floor(Math.random() * 5)];
      freeLookUntil = clockT + 6 + Math.random() * 6;
    }
  }
}

function readSound() {
  sc.getCurrentSound(s => {
    if (!s || s.id === scSoundId) return;
    scSoundId = s.id;
    scDuration = s.duration || s.full_duration || 0;
    nowEl.textContent = s.title || '';
    nowEl.href = s.permalink_url || DEFAULT_SOUNDCLOUD;
    nowEl.title = 'Listen on SoundCloud';
    loadScore((s.permalink_url || '').split('?')[0]);
    loadWave(s.waveform_url);
  });
}

// SoundCloud publishes each track's loudness over time; it drives the lines in sync with playback.
async function loadWave(url) {
  wave = null;
  if (!url) return;
  try {
    let j = null;
    try { const r = await fetch('/api/waveform?wave=' + encodeURIComponent(url.split('?')[0])); if (r.ok) j = await r.json(); } catch (e) {}
    if (!j || !j.samples) j = await (await fetch(url.replace(/\.png(\?.*)?$/, '.json'))).json();
    const h = j.height || 140;
    wave = j.samples.map(v => v / h);
    const sorted = [...wave].sort((a, b) => a - b);
    waveLo = sorted[Math.floor(sorted.length * 0.05)];
    waveHi = sorted[Math.floor(sorted.length * 0.98)] || 1;
    breakMap = mapBreaks(wave, scDuration);
  } catch (e) { wave = null; }  // fall back to a steady pulse
}

// Live energy of the music, shared with the camera: level 0..1, hit = sudden jumps in loudness.
let energy = 0, hit = 0, rowCount = 0;

function sampleSoundCloud(row) {
  const pos = scPos + (scPlaying ? performance.now() - scPosAt : 0);
  const t = pos / 1000;
  let level, kick, raw = 1;
  if (wave && scDuration) {
    const n = wave.length, fi = Math.max(0, Math.min(n - 1.001, (pos / scDuration) * n));
    const i0 = Math.floor(fi), fr = fi - i0;
    const norm = v => Math.max(0, Math.min(1, (v - waveLo) / (waveHi - waveLo || 1)));
    level = norm(wave[i0]) * (1 - fr) + norm(wave[i0 + 1]) * fr;      // smooth between waveform points
    raw = level;
    // local contrast: compare with the surrounding ±20 s, so every swell and dip shows even in a loud mix
    const win = Math.max(3, Math.round((20000 / scDuration) * n));
    let lmin = 1, lmax = 0;
    for (let k = -win; k <= win; k += Math.max(1, win >> 3)) { const v = norm(wave[Math.max(0, Math.min(n - 1, i0 + k))]); if (v < lmin) lmin = v; if (v > lmax) lmax = v; }
    const local = lmax - lmin > 0.05 ? (level - lmin) / (lmax - lmin) : 0.5;
    level = Math.min(1, 0.35 * level + 0.65 * local);
    const span = Math.max(2, Math.round((2000 / scDuration) * n));     // the last ~2 seconds
    let avg = 0;
    for (let k = 1; k <= span; k++) avg += norm(wave[Math.max(0, i0 - k)]);
    kick = Math.max(0, level - avg / span) * 5;
  } else {
    const beat = (pos / 500) % 1;            // ~120 bpm pulse if the waveform isn't available
    level = 0.4 + 0.35 * Math.exp(-beat * 6);
    kick = Math.exp(-beat * 8) * 0.5;
  }
  // silence is flat: no sound, no lines moving (fades in over the quietest few per cent)
  const gate = Math.max(0, Math.min(1, (raw - 0.03) / 0.09));
  if (gate <= 0) { row.fill(0); return; }
  shapeRow(row, t, level, kick);
  if (gate < 1) for (let i = 0; i < POINTS; i++) row[i] *= gate;
}

// Peaks drift smoothly over time; loudness lifts them, hits throw up sharp spikes.
function shapeRow(row, t, level, kick) {
  row.fill(0);
  const r = seeded(++rowCount * 2654435761);
  for (let k = 0; k < 6; k++) {
    const c = 0.5 + 0.3 * Math.sin(t * (0.31 + 0.13 * k) + k * 1.7) + 0.05 * Math.sin(t * (1.9 + k * 0.4));
    const w = 0.006 + 0.016 * (0.5 + 0.5 * Math.sin(t * 0.7 + k * 2.1));
    const a = (0.08 + level * 1.5) * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * (1.1 + 0.37 * k) + k * 2.3)));
    for (let i = 0; i < POINTS; i++) { const x = i / (POINTS - 1) - c; row[i] += a * Math.exp(-(x * x) / (2 * w * w)); }
  }
  if (kick > 0.08) {
    for (let k = 0; k < 3; k++) {
      const c = 0.5 + (r() - 0.5) * 0.6, w = 0.004 + r() * 0.006, a = kick * (1.2 + r() * 1.2);
      for (let i = 0; i < POINTS; i++) { const x = i / (POINTS - 1) - c; row[i] += a * Math.exp(-(x * x) / (2 * w * w)); }
    }
  }
  // jagged: fine random jitter and the odd sharp spike, like a pulsar plot
  for (let i = 0; i < POINTS; i++) {
    let j = r() * 0.1 * (0.3 + level);
    if (r() < 0.04) j += r() * 0.35 * level;
    row[i] = Math.min(row[i] + j, 1.7);
  }
}

/* ─── Source 2 & 3: local file / microphone (real frequency analysis) ── */
let actx = null, analyser = null, freq = null, binMap = null, timeBuf = null, specBuf = null;
let audioEl = null, micStream = null, micSource = null;
let lastMedia = 'sc';

function ensureAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = actx.createAnalyser();
  analyser.fftSize = FFT;
  analyser.smoothingTimeConstant = 0.55;
  analyser.minDecibels = -90;
  analyser.maxDecibels = -15;
  freq = new Uint8Array(analyser.frequencyBinCount);
  const nyq = actx.sampleRate / 2, bins = analyser.frequencyBinCount;
  binMap = new Float32Array(POINTS);
  for (let i = 0; i < POINTS; i++) {
    const t = i / (POINTS - 1);
    const d = Math.abs(t - 0.5) * 2;
    const skew = t < 0.5 ? 0.93 : 1.07;
    const hz = MIN_HZ * Math.pow(MAX_HZ / MIN_HZ, d) * skew;
    binMap[i] = Math.min(bins - 1, (hz / nyq) * bins);
  }
}

function sampleAnalyser(row) {
  analyser.getByteFrequencyData(freq);
  for (let i = 0; i < POINTS; i++) {
    const b = binMap[i], b0 = b | 0, f = b - b0;
    const v = (freq[b0] * (1 - f) + freq[Math.min(b0 + 1, freq.length - 1)] * f) / 255;
    row[i] = Math.min(1.7, Math.pow(v, 1.25) * 1.35);
  }
  // silence (or just background hiss on the mic) stays flat
  let peak = 0; for (let i = 0; i < POINTS; i++) if (row[i] > peak) peak = row[i];
  const gate = Math.max(0, Math.min(1, (peak - 0.06) / 0.12));
  for (let i = 0; i < POINTS; i++) row[i] *= gate;

}

function sampleIdle(row) {
  row.fill(0);                // no sound playing: flat lines
  energy = 0;
}

/* ─── Music analysis: kick, tempo, breaks and drops ───────── */
// Dance music breaks are where the kick drum drops out; the drop is where it comes back.
const music = { beat: 0.5, bpm: 0, lastKick: -99, kicks: [], breakTarget: 0, breakFor: 0, buildUp: 0, peak: 0.05, lowPeak: 1e-4 };
let breakMap = null, lowPrev = 0, fluxHist = [], liveT = 0;

// Live audio (local file or mic): detect kicks in the sub-bass, estimate tempo, flag breaks.
function analyseLive(dt) {
  liveT += dt;
  const n = analyser.fftSize, bins = analyser.frequencyBinCount;
  if (!timeBuf || timeBuf.length !== n) { timeBuf = new Float32Array(n); specBuf = new Float32Array(bins); }
  analyser.getFloatTimeDomainData(timeBuf);
  analyser.getFloatFrequencyData(specBuf);
  let sum = 0;
  for (let i = 0; i < n; i += 2) sum += timeBuf[i] * timeBuf[i];
  const rms = Math.sqrt(sum / (n / 2));
  music.peak = Math.max(rms, music.peak * Math.exp(-dt / 25), 0.01);      // self-adjusting loudness
  energy = Math.min(1, rms / music.peak);

  const hz = actx.sampleRate / n;
  let low = 0;
  for (let i = Math.max(1, Math.floor(40 / hz)); i <= Math.ceil(130 / hz); i++) low += Math.pow(10, specBuf[i] / 20);
  music.lowPeak = Math.max(low, music.lowPeak * Math.exp(-dt / 25), 1e-6);
  const flux = Math.max(0, low - lowPrev); lowPrev = low;
  fluxHist.push(flux); if (fluxHist.length > 90) fluxHist.shift();          // ~1.5 s of history
  const mean = fluxHist.reduce((a, b) => a + b, 0) / fluxHist.length;
  const sd = Math.sqrt(fluxHist.reduce((a, b) => a + (b - mean) ** 2, 0) / fluxHist.length);
  if (flux > mean + 1.6 * sd && flux > music.lowPeak * 0.08 && liveT - music.lastKick > 0.26) {
    music.lastKick = liveT;
    music.kicks.push(liveT);
    while (music.kicks.length && liveT - music.kicks[0] > 10) music.kicks.shift();
    hit = Math.max(hit, Math.min(1, flux / (music.lowPeak * 0.5)));
    // tempo: median gap between kicks, folded into 80–170 BPM
    const gaps = [];
    for (let i = 1; i < music.kicks.length; i++) {
      let g = music.kicks[i] - music.kicks[i - 1];
      while (g > 0.75) g /= 2;
      while (g < 0.353) g *= 2;
      gaps.push(g);
    }
    if (gaps.length >= 4) { gaps.sort((a, b) => a - b); music.beat = gaps[gaps.length >> 1]; music.bpm = Math.round(60 / music.beat); }
  }
  const kickGone = liveT - music.lastKick > Math.max(2.5 * music.beat, 1.2);
  const bassGone = low < music.lowPeak * 0.18;
  music.breakTarget = (kickGone || bassGone) && energy > 0.02 ? 1 : 0;
  music.buildUp = 0;
}

// SoundCloud: we only have the loudness outline, but we have all of it, so map the breaks in advance.
function mapBreaks(w, durMs) {
  const n = w.length, perSec = n / Math.max(1, durMs / 1000);
  const win = Math.max(1, Math.round(perSec * 2)), ctxN = Math.max(4, Math.round(perSec * 45));
  const sm = new Float32Array(n);
  for (let i = 0; i < n; i++) { let a = 0, c = 0; for (let k = -win; k <= win; k++) { const j = i + k; if (j >= 0 && j < n) { a += w[j]; c++; } } sm[i] = a / c; }
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    let ref = 0;                                           // the loud level of the surrounding ~minute
    for (let k = -ctxN; k <= ctxN; k += Math.max(1, ctxN >> 4)) { const j = i + k; if (j >= 0 && j < n && sm[j] > ref) ref = sm[j]; }
    out[i] = sm[i] < ref * 0.72 ? 1 : 0;
  }
  // ignore dips shorter than ~5 seconds
  const minLen = Math.max(2, Math.round(perSec * 5));
  for (let i = 0; i < n;) { if (!out[i]) { i++; continue; } let j = i; while (j < n && out[j]) j++; if (j - i < minLen) out.fill(0, i, j); i = j; }
  return out;
}

function analyseSC() {
  const pos = scPos + (scPlaying ? performance.now() - scPosAt : 0);
  if (!(wave && scDuration)) { energy = 0.5; music.breakTarget = 0; music.buildUp = 0; return; }
  const n = wave.length, fi = Math.max(0, Math.min(n - 1.001, (pos / scDuration) * n)), i0 = Math.floor(fi), fr = fi - i0;
  const norm = v => Math.max(0, Math.min(1, (v - waveLo) / (waveHi - waveLo || 1)));
  const level = norm(wave[i0]) * (1 - fr) + norm(wave[i0 + 1]) * fr;
  const span = Math.max(2, Math.round((2000 / scDuration) * n));
  let avg = 0; for (let k = 1; k <= span; k++) avg += norm(wave[Math.max(0, i0 - k)]);
  hit = Math.max(hit, Math.max(0, level - avg / span) * 3);
  energy = level;
  music.breakTarget = breakMap ? breakMap[i0] : 0;
  // see the drop coming: in the last 3 seconds of a break, build up
  const ahead = Math.round((3000 / scDuration) * n);
  music.buildUp = breakMap && breakMap[i0] && i0 + ahead < n && !breakMap[i0 + ahead] ? 1 : 0;
}

function analyse(dt) {
  if (source === 'file' || source === 'mic') analyseLive(dt);
  else if (source === 'sc') analyseSC();
  else { energy = 0.25; music.breakTarget = 0; music.buildUp = 0; }
  // break bookkeeping and the drop
  if (music.breakTarget) music.breakFor += dt;
  else {
    if (music.breakFor > 4) onDrop(music.breakFor);
    music.breakFor = 0;
  }
}

/* ─── Which source is driving the picture ────────────────── */
let source = 'idle';
function currentSource() {
  if (micStream) return 'mic';
  if (audioEl && !audioEl.paused) return 'file';
  if (scPlaying) return 'sc';
  return 'idle';
}

/* ─── 3D: a floating rectangle of ridge lines, and a camera that can go anywhere ── */
const RECT_W = 3.2, RECT_D = 4.6, AMP = 0.95, SHOW = 100;    // width, depth, peak height, lines on the rectangle
const TAU = Math.PI * 2;
const keys = new Set();
let lastInput = -1e9, calm = reduceMotion, clockT = 0, inBreak = 0, autoNow = false, lastLoop = 0, lastRoll = 0;
const touched = () => { lastInput = performance.now(); };

// how the rectangle bends: curl (it rises up like a wave you can climb), twist, ripple
const shape = { curl: 0, curlTo: 0, twist: 0, twistTo: 0, ripple: 0, rippleTo: 0 };

// a point on the rectangle: u -1..1 across, v 0 (near edge) .. 1 (far edge), h height off the surface
// surfInto writes the point to SX, SY, SZ (no garbage: it runs ~16,000 times a frame); surf returns it as an array.
let SX = 0, SY = 0, SZ = 0;
function surfInto(u, v, h) {
  const s = v * RECT_D, k = shape.curl * Math.PI / RECT_D;
  let x = u * RECT_W / 2, y, z, ny, nz;
  if (Math.abs(k) < 1e-4) { y = 0; z = s; ny = 1; nz = 0; }
  else { const R = 1 / k, a = s * k; y = R * (1 - Math.cos(a)); z = R * Math.sin(a); ny = Math.cos(a); nz = -Math.sin(a); }
  y += shape.ripple * 0.22 * Math.sin(u * 3 + clockT * 1.7 + v * 5);
  y += ny * h; z += nz * h;
  const tw = shape.twist * (v - 0.5) * Math.PI;
  if (tw) { const c = Math.cos(tw), sn = Math.sin(tw), X = x, Y = y; x = X * c - Y * sn; y = X * sn + Y * c; }
  SX = x; SY = y; SZ = z - RECT_D / 2;
}
function surf(u, v, h) { surfInto(u, v, h); return [SX, SY, SZ]; }

/* camera: position C looking at T with up U, all smoothed towards the director's targets */
const view = { yaw: 0.7, pitch: 0.45, dist: 6.5, zoom: 1, spin: 0, spinV: 0, shake: 0,
  mode: 'orbit', modeT: 0, ride: 0, side: 1, rideU: 0, speed: 1,
  C: [4, 3, 4], T: [0, 0, 0], U: [0, 1, 0] };
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

x;g.y=b.y}function upd(){tk++;gh.forEach(g=>{if(!g.s)g.m=(tk/200|0)%2?'c':'s'});if(pt>0){pt--;if(!pt)gh.forEach(g=>g.s=false)}if(tk%7===0){if(iD>=0){let nx=p.x+ds[iD].x,ny=p.y+ds[iD].y;nx=(nx%C+C)%C;if(cm(nx,ny))p.d=iD;iD=-1}let nx=p.x+ds[p.d].x,ny=p.y+ds[p.d].y;nx=(nx%C+C)%C;if(cm(nx,ny)){p.x=nx;p.y=ny}}dt=dt.filter(d=>{if(d.x===p.x&&d.y===p.y){sc+=10;return false}return true});pw=pw.filter(d=>{if(d.x===p.x&&d.y===p.y){sc+=50;pt=300;gh.forEach(g=>g.s=true);return false}return true});if(!dt.length&&!pw.length)gw=true;if(tk%9===0)gh.forEach(mg);gh.forEach(g=>{if(g.x===p.x&&g.y===p.y){if(g.s){sc+=200;g.x=10;g.y=9;g.s=false}else go=true}});p.mo+=p.md*.08;if(p.mo>.4)p.md=-1;if(p.mo<.02)p.md=1}function drw(){ppx.fillStyle='#000';ppx.fillRect(0,0,pcc.width,pcc.height);for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(M[r][c]===0){ppx.fillStyle='#080810';ppx.fillRect(c*T,r*T,T,T);ppx.strokeStyle='#151535';ppx.lineWidth=1;[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{let nr=r+dy,nc=c+dx;if(nr<0||nr>=R||nc<0||nc>=C)return;if(M[nr][nc]!==0){if(dx!==0){ppx.beginPath();ppx.moveTo(c*T+(dx===1?T:0),r*T);ppx.lineTo(c*T+(dx===1?T:0),r*T+T);ppx.stroke()}else{ppx.beginPath();ppx.moveTo(c*T,r*T+(dy===1?T:0));ppx.lineTo(c*T+T,r*T+(dy===1?T:0));ppx.stroke()}}})}}dt.forEach(d=>{ppx.fillStyle='#ffcc00';ppx.beginPath();ppx.arc(d.x*T+T/2,d.y*T+T/2,2,0,Math.PI*2);ppx.fill()});if(Math.sin(tk*.1)>.2)pw.forEach(d=>{ppx.fillStyle='#ffcc00';ppx.beginPath();ppx.arc(d.x*T+T/2,d.y*T+T/2,5,0,Math.PI*2);ppx.fill()});let px2=p.x*T+T/2,py2=p.y*T+T/2,a=[0,Math.PI/2,Math.PI,Math.PI*1.5][p.d];ppx.fillStyle='#ffcc00';ppx.beginPath();ppx.arc(px2,py2,T/2-.5,a+p.mo,a+Math.PI*2-p.mo);ppx.lineTo(px2,py2);ppx.fill();gh.forEach(g=>{let gx=g.x*T+T/2,gy=g.y*T+T/2;ppx.fillStyle=g.s?'#2222ff':g.c;ppx.beginPath();ppx.arc(gx,gy-2,T/2-1,Math.PI,0);ppx.lineTo(gx+T/2-1,gy+T/2-2);for(let i=0;i<3;i++){ppx.lineTo(gx+T/2-1-(i+.5)*(T-2)/3,gy+T/2-6);ppx.lineTo(gx+T/2-1-(i+1)*(T-2)/3,gy+T/2-2)}ppx.fill();if(!g.s){[[-3,-3],[3,-3]].forEach(([ox,oy])=>{ppx.fillStyle='#fff';ppx.beginPath();ppx.arc(gx+ox,gy+oy,3,0,Math.PI*2);ppx.fill();ppx.fillStyle='#00f';ppx.beginPath();ppx.arc(gx+ox+ds[g.d].x,gy+oy+ds[g.d].y,1.5,0,Math.PI*2);ppx.fill()})}else{ppx.fillStyle='#fff';[[-3,-3],[3,-3]].forEach(([ox,oy])=>{ppx.beginPath();ppx.arc(gx+ox,gy+oy,2,0,Math.PI*2);ppx.fill()})}});if(go){ppx.fillStyle='rgba(0,0,0,.8)';ppx.fillRect(0,0,pcc.width,pcc.height);ppx.fillStyle='#cc0000';ppx.font='500 22px "Syne"';ppx.textAlign='center';ppx.fillText('Game Over',pcc.width/2,pcc.height/2);ppx.fillStyle='#333';ppx.font='300 10px "IBM Plex Mono"';ppx.fillText('Click to restart',pcc.width/2,pcc.height/2+22)}if(gw){ppx.fillStyle='rgba(0,0,0,.8)';ppx.fillRect(0,0,pcc.width,pcc.height);ppx.fillStyle='#c90';ppx.font='500 22px "Syne"';ppx.textAlign='center';ppx.fillText('You Win',pcc.width/2,pcc.height/2)}se.textContent='Score: '+sc}function gl2(){if(!ov.classList.contains('active'))return;if(!go&&!gw)upd();drw();pg=requestAnimationFrame(gl2)}pcc.onclick=()=>{if(go||gw)startPac()};gl2()}
</script>
